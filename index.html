<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TT - Bảng chấm công</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#17212b;font-family:Arial,Helvetica,sans-serif}.app{max-width:1600px;margin:auto;padding:10px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 10px}.top h2{margin:0;font-size:21px}.tabs{display:flex;gap:7px;overflow-x:auto;position:sticky;top:0;z-index:20;background:#f3f6fa;padding:4px 0 9px}.tab{flex:0 0 auto;border:0;border-radius:12px;padding:11px 15px;background:#e2e8f0;color:#334155;font-weight:700;white-space:nowrap}.tab.active{background:#1677ff;color:#fff}.tab.summary{background:#7c3aed;color:#fff}.tab.add{background:#087443;color:#fff}button,input,select{font:inherit;border:1px solid #ccd6e2;border-radius:10px;padding:9px 10px;background:#fff}button{border:0;background:#1677ff;color:#fff;font-weight:700;cursor:pointer}.green{background:#087443}.gray{background:#667085}.orange{background:#d97706}.purple{background:#7c3aed}.danger{background:#b42318}.card{background:#fff;border-radius:15px;padding:13px;margin:9px 0;box-shadow:0 2px 12px #0f172a14}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.title{font-size:20px;font-weight:800}.hint{font-size:13px;color:#667085}.money{color:#087443;font-weight:800}.wages{display:grid;grid-template-columns:repeat(3,minmax(150px,240px));gap:8px}.wage{display:flex;flex-direction:column;gap:4px}.wage label{font-size:12px;font-weight:800;color:#475467}.wage input{font-weight:700}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.stat{padding:9px 12px;border-radius:11px;background:#f7f9fc}.tableWrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1250px}th,td{border:1px solid #d9e1ea;padding:6px;text-align:center;font-size:12px}th{background:#edf3fa;font-weight:800}.left{text-align:left}.grid th,.grid td{min-width:58px}.grid th:first-child,.grid td:first-child{position:sticky;left:0;z-index:3;background:#fff;min-width:145px}.grid th:first-child{background:#edf3fa}.daycell{height:68px;cursor:pointer}.daycell:hover{background:#eef5ff}.worked{background:#e8f7ed}.construction{background:#fff0d8}.today{outline:2px solid #1677ff;outline-offset:-2px}.daynum{font-size:13px;font-weight:900}.times{font-size:10px;color:#475467;margin-top:3px}.place{font-size:10px;font-weight:700}.ot{font-size:10px;color:#7c3aed;font-weight:800;margin-top:2px}.empty{text-align:center;color:#98a2b3;padding:20px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:14px;z-index:100}.modal.show{display:flex}.box{width:min(520px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:18px;padding:18px}.box h3{margin:0 0 12px}.row{display:flex;gap:8px;margin:8px 0}.row>*{flex:1;min-width:0}.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.choice button{min-height:75px;font-size:16px}.choice .selected{outline:4px solid #1677ff}.otbox{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:flex;flex-direction:column;gap:4px}.field label{font-size:12px;font-weight:800;color:#475467}.summaryBox{border:2px solid #eadcff;background:#fbf9ff}.summaryTotal{font-size:18px;font-weight:900;color:#7c3aed}.mini{font-size:11px;color:#667085}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#17212b;color:#fff;padding:10px 15px;border-radius:12px;display:none;z-index:200}.toast.show{display:block}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px}.legend span{padding:5px 8px;border-radius:7px}.sign{display:none}
@media(max-width:600px){.app{padding:8px}.top h2{font-size:18px}.wages{grid-template-columns:1fr 1fr}.wages .wage:last-child{grid-column:1/-1}.choice button{font-size:14px;min-height:70px}.row{flex-direction:column}.row button{width:100%}.otbox{grid-template-columns:1fr 1fr}}
@media print{body{background:#fff}.noPrint{display:none!important}.app{max-width:none;padding:0}.card{box-shadow:none;padding:4px;margin:0 0 6px}.tableWrap{overflow:visible}.grid{min-width:0;width:100%}.grid th,.grid td{font-size:7px;padding:2px;min-width:0}.grid th:first-child,.grid td:first-child{position:static;min-width:55px}.sign{display:flex;justify-content:space-around;text-align:center;margin-top:22px}.sign div{width:220px}}
</style>
</head>
<body>
<div class="app">
<div class="top noPrint"><h2>🕘 TT - BẢNG CHẤM CÔNG</h2><div class="controls"><button class="green" onclick="jpgExportWorkshop()">📸 Xuất JPG & Gửi Zalo</button><b id="clock"></b></div></div>
<div id="tabs" class="tabs noPrint"></div>
<div id="content"></div>
</div>

<div id="workshopModal" class="modal"><div class="box"><h3>🏭 Thêm xưởng</h3><div class="row"><input id="wName" placeholder="Tên xưởng"></div><div class="row"><input id="wLX" type="number" min="0" inputmode="numeric" placeholder="Lương làm xưởng / ngày"></div><div class="row"><input id="wCT" type="number" min="0" inputmode="numeric" placeholder="Lương đi công trình / ngày"></div><div class="row"><input id="wOT" type="number" min="0" step="1000" inputmode="numeric" placeholder="Tiền tăng ca / giờ"></div><div class="row"><button class="green" onclick="saveWorkshop()">Lưu</button><button class="gray" onclick="closeM('workshopModal')">Hủy</button></div></div></div>

<div id="punchModal" class="modal"><div class="box"><h3>🟢 CHẤM CÔNG</h3><div class="hint" id="punchWorkshop"></div><div class="row"><input id="pName" placeholder="Tên người chấm công"></div><div class="row"><input id="pDate" type="date"></div><div class="choice"><button id="btnLX" class="green" onclick="chooseType('xuong')">🏭<br>LX<br><small>Làm xưởng</small></button><button id="btnCT" class="orange" onclick="chooseType('congtrinh')">🏗<br>CT<br><small>Công trình</small></button></div><div class="row"><input id="pWage" type="number" min="0" inputmode="numeric" placeholder="Tiền lương/ngày"></div><div class="otbox"><div class="field"><label>🌅 Tăng ca sáng (giờ)</label><input id="pOTMorning" type="number" min="0" step="0.25" inputmode="decimal" value="0"></div><div class="field"><label>🌙 Tăng ca tối (giờ)</label><input id="pOTEve" type="number" min="0" step="0.25" inputmode="decimal" value="0"></div></div><div class="row"><input id="pOTRate" type="number" min="0" step="1000" inputmode="numeric" placeholder="Tiền tăng ca / giờ"></div><div class="hint">Chấm ngày nào thì chọn ngày đó. Lần 1 ghi giờ vào · lần 2 ghi giờ ra. Tổng tiền tăng ca = (tăng ca sáng + tăng ca tối) × tiền tăng ca/giờ.</div><div class="row"><button class="green" onclick="doPunch()">Xác nhận chấm công</button><button class="gray" onclick="closeM('punchModal')">Hủy</button></div></div></div>

<div id="editModal" class="modal"><div class="box"><h3>✏️ Sửa chấm công</h3><div id="editInfo" class="hint"></div><div class="row"><input id="eDate" type="date"><input id="eIn" type="time" step="1"><input id="eOut" type="time" step="1"></div><div class="choice"><button id="eLX" class="green" onclick="chooseEditType('xuong')">🏭 LX<br><small>Làm xưởng</small></button><button id="eCT" class="orange" onclick="chooseEditType('congtrinh')">🏗 CT<br><small>Công trình</small></button></div><div class="row"><input id="eWage" type="number" min="0" inputmode="numeric" placeholder="Tiền lương/ngày"></div><div class="otbox"><div class="field"><label>🌅 Tăng ca sáng (giờ)</label><input id="eOTMorning" type="number" min="0" step="0.25" inputmode="decimal"></div><div class="field"><label>🌙 Tăng ca tối (giờ)</label><input id="eOTEve" type="number" min="0" step="0.25" inputmode="decimal"></div></div><div class="row"><input id="eOTRate" type="number" min="0" step="1000" inputmode="numeric" placeholder="Tiền tăng ca / giờ"></div><div class="hint" id="editCalc"></div><div class="row"><button class="green" onclick="saveEdit()">Lưu</button><button class="danger" onclick="removeEdit()">Xóa</button><button class="gray" onclick="closeM('editModal')">Hủy</button></div></div></div>
<div id="toast" class="toast"></div>

<script>
const KEY='TT_CC_V11';
let data=load(),active=0,month=new Date().toISOString().slice(0,7),view='workshop',pType='xuong',editKey='',editType='xuong',editOriginalKey='';
function uid(){return'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function load(){let d=null;for(let k of [KEY,'TT_CC_V10','TT_CC_V9','TT_CC_V8','TT_CC_V7','TT_CC_V6']){try{d=JSON.parse(localStorage.getItem(k)||'null');if(d)break}catch(e){}}let x={workshops:[],records:{}};if(d&&Array.isArray(d.workshops)){x.workshops=d.workshops.map(w=>({id:w.id||uid(),name:w.name||'Xưởng',lx:Number(w.lx??w.pay)||0,ct:Number(w.ct??0)||0,ot:Number(w.ot??0)||0}));Object.keys(d.records||{}).forEach(k=>{let r=d.records[k]||{};x.records[k]={...r,otMorning:Number(r.otMorning||0),otEvening:Number(r.otEvening||0),otRate:Number(r.otRate||0)}})}else{x.workshops=[{id:uid(),name:'Xưởng 1',lx:0,ct:0,ot:0}]};return normalize(x)}
function normalize(d){d.records=d.records||{};d.workshops=(d.workshops||[]).map(w=>({id:w.id||uid(),name:w.name||'Xưởng',lx:Number(w.lx??w.pay)||0,ct:Number(w.ct??0)||0,ot:Number(w.ot??0)||0}));Object.keys(d.records).forEach(k=>{let r=d.records[k]||{};r.otMorning=Number(r.otMorning||0);r.otEvening=Number(r.otEvening||0);r.otRate=Number(r.otRate||0);d.records[k]=r});if(!d.workshops.length)d.workshops=[{id:uid(),name:'Xưởng 1',lx:0,ct:0,ot:0}];localStorage.setItem(KEY,JSON.stringify(d));return d}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return Number(n||0).toLocaleString('vi-VN')+' đ'}
function pad(n){return String(n).padStart(2,'0')}
function dt(y,m,d){return y+'-'+pad(m)+'-'+pad(d)}
function today(){let x=new Date();return dt(x.getFullYear(),x.getMonth()+1,x.getDate())}
function now(){let x=new Date();return pad(x.getHours())+':'+pad(x.getMinutes())+':'+pad(x.getSeconds())}
function key(w,e,d){return w.id+'|'+e+'|'+d}
function rec(w,e,d){return data.records[key(w,e,d)]||null}
function hours(a,b){if(!a||!b)return 0;let A=a.split(':').map(Number),B=b.split(':').map(Number),v=B[0]*3600+B[1]*60+(B[2]||0)-A[0]*3600-A[1]*60-(A[2]||0);if(v<0)v+=86400;return v/3600}
function otHours(r){return Number(r?.otMorning||0)+Number(r?.otEvening||0)}
function otMoney(r){return otHours(r)*Number(r?.otRate||0)}
function closeM(id){document.getElementById(id).classList.remove('show')}
function openM(id){document.getElementById(id).classList.add('show')}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function tabs(){let h=data.workshops.map((w,i)=>'<button class="tab '+(view==='workshop'&&i===active?'active':'')+'" onclick="view=\'workshop\';active='+i+';render()">🏭 '+esc(w.name)+'</button>').join('');h+='<button class="tab summary '+(view==='summary'?'active':'')+'" onclick="view=\'summary\';render()">💰 TỔNG LƯƠNG</button>';h+='<button class="tab add" onclick="newWorkshop()">＋ Thêm xưởng</button>';document.getElementById('tabs').innerHTML=h}
function newWorkshop(){document.getElementById('wName').value='';document.getElementById('wLX').value='';document.getElementById('wCT').value='';document.getElementById('wOT').value='';openM('workshopModal')}
function saveWorkshop(){let n=document.getElementById('wName').value.trim(),lx=Number(document.getElementById('wLX').value||0),ct=Number(document.getElementById('wCT').value||0),ot=Number(document.getElementById('wOT').value||0);if(!n)return toast('Nhập tên xưởng');data.workshops.push({id:uid(),name:n,lx,ct,ot});active=data.workshops.length-1;view='workshop';save();closeM('workshopModal');toast('Đã tạo xưởng')}
function editWorkshop(){let w=data.workshops[active],n=prompt('Tên xưởng:',w.name);if(n===null)return;let lx=prompt('Lương làm xưởng / ngày:',w.lx),ct=prompt('Lương đi công trình / ngày:',w.ct),ot=prompt('Tiền tăng ca / giờ:',w.ot);if(lx===null||ct===null||ot===null)return;w.name=n.trim()||w.name;w.lx=Number(lx)||0;w.ct=Number(ct)||0;w.ot=Number(ot)||0;save();toast('Đã cập nhật lương')}
function deleteWorkshop(){if(data.workshops.length===1)return toast('Phải giữ ít nhất 1 xưởng');let w=data.workshops[active];if(!confirm('Xóa '+w.name+' và toàn bộ chấm công?'))return;Object.keys(data.records).forEach(k=>{if(k.startsWith(w.id+'|'))delete data.records[k]});data.workshops.splice(active,1);active=Math.max(0,active-1);save()}
function openPunch(){let w=data.workshops[active];pType='xuong';document.getElementById('pName').value='';document.getElementById('pDate').value=today();document.getElementById('punchWorkshop').textContent=w.name+' · chọn LX hoặc CT';document.getElementById('pWage').value=w.lx;document.getElementById('pOTMorning').value=0;document.getElementById('pOTEve').value=0;document.getElementById('pOTRate').value=w.ot;markType();openM('punchModal')}
function chooseType(t){pType=t;let w=data.workshops[active];document.getElementById('pWage').value=t==='xuong'?w.lx:w.ct;document.getElementById('pOTRate').value=w.ot;markType()}
function markType(){document.getElementById('btnLX').classList.toggle('selected',pType==='xuong');document.getElementById('btnCT').classList.toggle('selected',pType==='congtrinh')}
function doPunch(){let w=data.workshops[active],name=document.getElementById('pName').value.trim(),date=document.getElementById('pDate').value||today(),wage=Number(document.getElementById('pWage').value||0),om=Number(document.getElementById('pOTMorning').value||0),oe=Number(document.getElementById('pOTEve').value||0),orate=Number(document.getElementById('pOTRate').value||0);if(!name)return toast('Nhập tên người chấm công');if(wage<0||om<0||oe<0||orate<0)return toast('Số tiền hoặc giờ tăng ca không hợp lệ');let k=key(w,name,date),r=data.records[k];if(!r){data.records[k]={in:now(),out:'',type:pType,wage,otMorning:om,otEvening:oe,otRate:orate};toast('Đã ghi giờ vào')}else if(!r.out){r.out=now();r.type=pType;r.wage=wage;r.otMorning=om;r.otEvening=oe;r.otRate=orate;toast('Đã ghi giờ ra')}else{data.records[k]={in:now(),out:'',type:pType,wage,otMorning:om,otEvening:oe,otRate:orate};toast('Bắt đầu ca mới')}save();closeM('punchModal')}
function openEdit(name,date){let w=data.workshops[active],k=key(w,name,date),r=data.records[k]||{in:'',out:'',type:'xuong',wage:w.lx,otMorning:0,otEvening:0,otRate:w.ot};editKey=k;editOriginalKey=k;editType=r.type||'xuong';document.getElementById('editInfo').textContent=name+' · chọn ngày và chỉnh toàn bộ chấm công';document.getElementById('eDate').value=date;document.getElementById('eIn').value=r.in||'';document.getElementById('eOut').value=r.out||'';document.getElementById('eWage').value=Number(r.wage??(editType==='xuong'?w.lx:w.ct));document.getElementById('eOTMorning').value=Number(r.otMorning||0);document.getElementById('eOTEve').value=Number(r.otEvening||0);document.getElementById('eOTRate').value=Number(r.otRate??w.ot);updateEditCalc();markEditType();openM('editModal')}
function chooseEditType(t){editType=t;let w=data.workshops[active];document.getElementById('eWage').value=t==='xuong'?w.lx:w.ct;document.getElementById('eOTRate').value=w.ot;updateEditCalc();markEditType()}
function markEditType(){document.getElementById('eLX').classList.toggle('selected',editType==='xuong');document.getElementById('eCT').classList.toggle('selected',editType==='congtrinh')}
function updateEditCalc(){let om=Number(document.getElementById('eOTMorning')?.value||0),oe=Number(document.getElementById('eOTEve')?.value||0),rate=Number(document.getElementById('eOTRate')?.value||0),e=document.getElementById('editCalc');if(e)e.textContent='Tổng tăng ca: '+(om+oe).toFixed(2)+' giờ × '+money(rate)+' = '+money((om+oe)*rate)}
['eOTMorning','eOTEve','eOTRate'].forEach(id=>document.getElementById(id).addEventListener('input',updateEditCalc));
function saveEdit(){if(!editKey)return;let date=document.getElementById('eDate').value,name=editKey.split('|')[1],w=data.workshops[active],wage=Number(document.getElementById('eWage').value||0),om=Number(document.getElementById('eOTMorning').value||0),oe=Number(document.getElementById('eOTEve').value||0),orate=Number(document.getElementById('eOTRate').value||0);if(!date)return toast('Chọn ngày');if(wage<0||om<0||oe<0||orate<0)return toast('Dữ liệu không hợp lệ');let nk=key(w,name,date);if(nk!==editOriginalKey)delete data.records[editOriginalKey];data.records[nk]={in:document.getElementById('eIn').value,out:document.getElementById('eOut').value,type:editType,wage,otMorning:om,otEvening:oe,otRate:orate};save();closeM('editModal');toast('Đã lưu chấm công')}
function removeEdit(){if(!editKey)return;if(!confirm('Xóa chấm công ngày này?'))return;delete data.records[editOriginalKey];if(editKey!==editOriginalKey)delete data.records[editKey];save();closeM('editModal');toast('Đã xóa')}
function namesForMonth(w,Y,M){let s=new Set();Object.keys(data.records).forEach(k=>{if(!k.startsWith(w.id+'|'))return;let a=k.split('|'),d=a[2]||'';if(d.startsWith(Y+'-'+pad(M)+'-'))s.add(a[1])});return Array.from(s).sort((a,b)=>a.localeCompare(b,'vi'))}
function workshopTotals(w,Y,M){let prefix=w.id+'|',days=0,workPay=0,otH=0,otPay=0,people=new Set();Object.keys(data.records).forEach(k=>{if(!k.startsWith(prefix))return;let a=k.split('|'),date=a[2]||'';if(!date.startsWith(Y+'-'+pad(M)+'-'))return;let r=data.records[k];people.add(a[1]);days++;workPay+=Number(r.wage||0);otH+=otHours(r);otPay+=otMoney(r)});return{days,people:people.size,workPay,otH,otPay,total:workPay+otPay}}
function renderWorkshop(){let w=data.workshops[active];if(!w)return;let [Y,M]=month.split('-').map(Number),days=new Date(Y,M,0).getDate(),names=namesForMonth(w,Y,M),totalD=0,totalH=0,totalP=0,totalOT=0,totalOTH=0;let head='<tr><th>Người chấm</th>';for(let d=1;d<=days;d++)head+='<th>'+pad(d)+'</th>';head+='<th>Tổng ngày</th><th>Tổng giờ</th><th>Tổng tăng ca</th><th>Tiền tăng ca</th><th>Tổng tiền</th></tr>';let body='';names.forEach(name=>{let dcount=0,hcount=0,pcount=0,oth=0,otp=0,cells='';for(let d=1;d<=days;d++){let date=dateKey(Y,M,d),r=rec(w,name,date),cl='daycell'+(date===today()?' today':'');if(r){dcount++;let rh=hours(r.in,r.out),roh=otHours(r),rop=otMoney(r);hcount+=rh;oth+=roh;otp+=rop;pcount+=Number(r.wage||0);cl+=' '+(r.type==='congtrinh'?'construction':'worked');cells+='<td class="'+cl+'" onclick="openEdit('+JSON.stringify(name)+','+JSON.stringify(date)+')"><div class="daynum">'+(r.type==='congtrinh'?'CT':'LX')+'</div><div class="times">'+esc(r.in||'')+' → '+esc(r.out||'')+'</div><div class="place">'+money(r.wage||0)+'</div>'+(roh?'<div class="ot">TC '+roh.toFixed(2)+'h · '+money(rop)+'</div>':'')+'</td>'}else cells+='<td class="'+cl+'" onclick="openEdit('+JSON.stringify(name)+','+JSON.stringify(date)+')">—</td>'}totalD+=dcount;totalH+=hcount;totalP+=pcount;totalOTH+=oth;totalOT+=otp;body+='<tr><td class="left"><b>'+esc(name)+'</b></td>'+cells+'<td><b>'+dcount+'</b></td><td>'+hcount.toFixed(2)+'</td><td>'+oth.toFixed(2)+' giờ</td><td class="money">'+money(otp)+'</td><td class="money">'+money(pcount+otp)+'</td></tr>'});document.getElementById('content').innerHTML='<div class="card"><div class="bar"><div><div class="title">🏭 '+esc(w.name)+'</div><div class="hint">Chấm công trực tiếp trong xưởng này · chạm vào bất kỳ ngày nào để sửa</div></div><div class="controls noPrint"><button class="orange" onclick="editWorkshop()">⚙️ Sửa lương</button><button class="danger" onclick="deleteWorkshop()">Xóa xưởng</button></div></div><div class="wages noPrint" style="margin-top:12px"><div class="wage"><label>LX · Lương làm xưởng / ngày</label><input type="number" min="0" value="'+Number(w.lx||0)+'" onchange="w.lx=Number(this.value||0);save()"></div><div class="wage"><label>CT · Lương đi công trình / ngày</label><input type="number" min="0" value="'+Number(w.ct||0)+'" onchange="w.ct=Number(this.value||0);save()"></div><div class="wage"><label>💰 Tiền tăng ca / giờ</label><input type="number" min="0" step="1000" value="'+Number(w.ot||0)+'" onchange="w.ot=Number(this.value||0);save()"></div></div><div class="stats"><span class="stat">📅 '+pad(M)+'/'+Y+'</span><span class="stat">👤 '+names.length+' người</span><span class="stat">✅ '+totalD+' ngày</span><span class="stat">⏱ '+totalH.toFixed(2)+' giờ</span><span class="stat">🌙 TC '+totalOTH.toFixed(2)+' giờ</span><span class="stat money">💰 Tiền công '+money(totalP)+'</span><span class="stat money">💜 Tiền tăng ca '+money(totalOT)+'</span><span class="stat money">💵 Tổng cộng '+money(totalP+totalOT)+'</span></div></div><div class="card noPrint"><div class="bar"><div><b>🟢 Chấm công</b><div class="hint">Không cần thêm nhân viên. Có thể chọn ngày trực tiếp khi chấm.</div></div><div class="controls"><input type="month" value="'+month+'" onchange="month=this.value;render()"><button class="purple" onclick="monthHistory()">📅 Tháng trước</button><button class="green" onclick="openPunch()">🟢 CHẤM CÔNG</button><button onclick="window.print()">🖨️ Xuất PDF</button></div></div></div><div class="card"><div class="bar"><b>📅 Bảng chấm công tháng '+pad(M)+'/'+Y+'</b><div class="legend"><span class="worked">LX = Làm xưởng</span><span class="construction">CT = Công trình</span><span>Chạm ngày = sửa chấm công</span></div></div><div class="tableWrap"><table class="grid"><thead>'+head+'</thead><tbody>'+(body||'<tr><td colspan="99" class="empty">Chưa có dữ liệu. Nhấn CHẤM CÔNG để bắt đầu.</td></tr>')+'</tbody></table></div><div class="sign"><div>Người lập bảng<br><br><br>________________</div><div>Người duyệt<br><br><br>________________</div></div></div>'}
function renderSummary(){let [Y,M]=month.split('-').map(Number),rows='',gDays=0,gPeople=0,gWork=0,gOTH=0,gOT=0,gTotal=0;data.workshops.forEach(w=>{let t=workshopTotals(w,Y,M);gDays+=t.days;gPeople+=t.people;gWork+=t.workPay;gOTH+=t.otH;gOT+=t.otPay;gTotal+=t.total;rows+='<tr><td class="left"><b>🏭 '+esc(w.name)+'</b></td><td>'+t.people+'</td><td>'+t.days+'</td><td>'+money(t.workPay)+'</td><td>'+t.otH.toFixed(2)+' giờ</td><td class="money">'+money(t.otPay)+'</td><td class="summaryTotal">'+money(t.total)+'</td></tr>'});document.getElementById('content').innerHTML='<div class="card summaryBox"><div class="bar"><div><div class="title">💰 TỔNG LƯƠNG THEO XƯỞNG</div><div class="hint">Chọn tháng để tổng hợp toàn bộ các xưởng trong tháng đó.</div></div><div class="controls noPrint"><label><b>Tháng:</b></label><input type="month" value="'+month+'" onchange="month=this.value;render()"><button onclick="window.print()">🖨️ In / Xuất PDF</button></div></div><div class="stats"><span class="stat">📅 '+pad(M)+'/'+Y+'</span><span class="stat">🏭 '+data.workshops.length+' xưởng</span><span class="stat">👤 '+gPeople+' lượt người</span><span class="stat">✅ '+gDays+' ngày công</span><span class="stat">🌙 TC '+gOTH.toFixed(2)+' giờ</span><span class="stat money">💰 Tiền công '+money(gWork)+'</span><span class="stat money">💜 Tiền tăng ca '+money(gOT)+'</span><span class="stat summaryTotal">💵 TỔNG LƯƠNG '+money(gTotal)+'</span></div></div><div class="card"><div class="bar"><b>📊 Bảng tổng hợp lương tháng '+pad(M)+'/'+Y+'</b><span class="mini">Tổng lương = Tiền công + Tiền tăng ca</span></div><div class="tableWrap"><table><thead><tr><th>Xưởng</th><th>Số người</th><th>Ngày công</th><th>Tiền công</th><th>Tổng tăng ca</th><th>Tiền tăng ca</th><th>TỔNG LƯƠNG</th></tr></thead><tbody>'+rows+'<tr><th class="left">TỔNG TẤT CẢ XƯỞNG</th><th>'+gPeople+'</th><th>'+gDays+'</th><th>'+money(gWork)+'</th><th>'+gOTH.toFixed(2)+' giờ</th><th>'+money(gOT)+'</th><th class="summaryTotal">'+money(gTotal)+'</th></tr></tbody></table></div></div><div class="card"><b>📌 Cách tính</b><div class="hint" style="margin-top:6px">Tiền tăng ca từng ngày = (Tăng ca sáng + Tăng ca tối) × Tiền tăng ca/giờ. Tổng lương của xưởng = Tổng tiền công + Tổng tiền tăng ca.</div></div>'}
function render(){tabs();if(view==='summary')renderSummary();else renderWorkshop()}
function dateKey(y,m,d){return y+'-'+pad(m)+'-'+pad(d)}
setInterval(()=>{let e=document.getElementById('clock');if(e)e.textContent=new Date().toLocaleString('vi-VN',{hour12:false})},1000);
render();
function zaloExportWorkshop(){
  let w=data.workshops[active];
  if(!w)return toast('Chưa chọn xưởng');
  let ym=month;
  let names=[];
  Object.keys(data.records||{}).forEach(k=>{
    let r=data.records[k]||{};
    if(k.startsWith(w.id+'|') && r.date && r.date.slice(0,7)===ym && r.name && !names.includes(r.name)) names.push(r.name);
  });
  if(!names.length){
    Object.keys(data.records||{}).forEach(k=>{
      let a=k.split('|'); let r=data.records[k]||{};
      if(a[0]===w.id && a[2] && a[2].slice(0,7)===ym){let n=a[1];if(n&&!names.includes(n))names.push(n)}
    });
  }
  names.sort((a,b)=>a.localeCompare(b,'vi'));
  let rows=[['BẢNG CHẤM CÔNG',w.name],['Tháng',ym],[],['Họ tên','Ngày','Loại','Giờ vào','Giờ ra','Lương ngày','TC giờ','Tiền TC']];
  let total=0,ot=0;
  names.forEach(n=>{
    let list=[];
    Object.keys(data.records||{}).forEach(k=>{
      let a=k.split('|'); let r=data.records[k]||{};
      if(a[0]===w.id&&a[1]===n&&a[2]&&a[2].slice(0,7)===ym)list.push([a[2],r]);
    });
    list.sort((a,b)=>a[0].localeCompare(b[0]));
    list.forEach(([d,r])=>{
      let day=Number(r.wage||0), oh=otHours(r), om=otMoney(r); total+=day;ot+=om;
      rows.push([n,d,r.type==='congtrinh'?'CT':'LX',r.in||'',r.out||'',day,oh,om]);
    });
  });
  rows.push([]); rows.push(['TỔNG','','','','',total,otHoursTotal(rows),ot]);
  let csv='\\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\\r\\n');
  let file=new File([csv],'Bang_cham_cong_'+w.name.replace(/[^a-zA-Z0-9À-ỹ _-]/g,'_')+'_'+ym+'.csv',{type:'text/csv;charset=utf-8'});
  let text='BẢNG CHẤM CÔNG - '+w.name+' - THÁNG '+ym+'\\nTổng lương: '+money(total)+'\\nTổng tiền tăng ca: '+money(ot)+'\\nTổng cộng: '+money(total+ot); 
  if(navigator.share){
    navigator.share({title:'Bảng chấm công '+w.name,text:text,files:[file]}).then(()=>toast('Đã mở bảng chia sẻ — chọn Zalo')).catch(e=>{if(e.name!=='AbortError')fallbackZalo(text,csv)});
  }else fallbackZalo(text,csv);
}
function otHoursTotal(rows){return rows.slice(4).reduce((sum,r)=>sum+(Number(r[6])||0),0)}
function fallbackZalo(text,csv){
  try{navigator.clipboard.writeText(text+'\\n\\n'+csv).then(()=>toast('Đã sao chép bảng công. Mở Zalo và dán để gửi.')).catch(()=>toast('Không mở được chia sẻ; hãy dùng chức năng Chia sẻ của trình duyệt.'))}
  catch(e){toast('Không mở được chia sẻ Zalo trên thiết bị này')}
}
function jpgExportWorkshop(){
  let w=data.workshops[active]; if(!w)return toast('Chưa chọn xưởng');
  let ym=month, rows=[];
  for(let d=1;d<=31;d++){
    let date=ym+'-'+pad(d);
    let found=[];
    Object.keys(data.records||{}).forEach(k=>{let a=k.split('|'),r=data.records[k]||{};if(a[0]===w.id&&a[2]===date)found.push([a[1],r])});
    found.forEach(([n,r])=>rows.push({n,date,r}));
  }
  if(!rows.length)return toast('Xưởng này chưa có dữ liệu tháng '+ym);
  let cvs=document.createElement('canvas'),ctx=cvs.getContext('2d');
  let W=1800, line=54, H=190+line*(rows.length+4); cvs.width=W;cvs.height=H;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.fillStyle='#17212b';
  ctx.font='bold 36px Arial';ctx.fillText('BẢNG CHẤM CÔNG - '+w.name,50,55);
  ctx.font='24px Arial';ctx.fillText('Tháng '+ym,50,95);
  let heads=['Họ tên','Ngày','Loại','Giờ vào','Giờ ra','Lương ngày','TC giờ','Tiền TC'];
  let widths=[300,150,130,180,180,250,160,250];let x=30,y=130;
  ctx.font='bold 22px Arial';ctx.fillStyle='#edf3fa';ctx.fillRect(x,y,W-60,line);ctx.fillStyle='#17212b';
  heads.forEach((h,i)=>{ctx.fillText(h,x+10,y+35);x+=widths[i]});
  y+=line;ctx.font='21px Arial';let total=0,ot=0;
  rows.forEach(o=>{x=30;let r=o.r,day=Number(r.wage||0),oh=otHours(r),om=otMoney(r);total+=day;ot+=om;let vals=[o.n,o.date,r.type==='congtrinh'?'CT':'LX',r.in||'',r.out||'',money(day),oh.toFixed(2),money(om)];vals.forEach((v,i)=>{ctx.strokeStyle='#d9e1ea';ctx.strokeRect(x,y,widths[i],line);ctx.fillStyle='#17212b';ctx.fillText(String(v),x+8,y+34);x+=widths[i]});y+=line});
  ctx.font='bold 24px Arial';ctx.fillText('TỔNG LƯƠNG: '+money(total)+'    TỔNG TĂNG CA: '+money(ot)+'    TỔNG CỘNG: '+money(total+ot),40,y+45);
  cvs.toBlob(blob=>{let file=new File([blob],'Bang_cham_cong_'+w.name.replace(/[^a-zA-Z0-9À-ỹ _-]/g,'_')+'_'+ym+'.jpg',{type:'image/jpeg'});let text='BẢNG CHẤM CÔNG - '+w.name+' - THÁNG '+ym+'\nTổng lương: '+money(total)+'\nTăng ca: '+money(ot)+'\nTổng cộng: '+money(total+ot);if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({title:'Bảng chấm công '+w.name,text,files:[file]}).then(()=>toast('Đã mở chia sẻ — chọn Zalo')).catch(e=>{if(e.name!=='AbortError')downloadJpg(blob,file.name)})}else downloadJpg(blob,file.name)},'image/jpeg',0.94);
}
function downloadJpg(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Đã tạo ảnh JPG, hãy mở Zalo để gửi')}
</script>
<script>
/* TT V12 - TẠM ỨNG LƯƠNG */
(function(){
  const ADV='TT_CC_V12_ADVANCE';
  let advances=[];
  try{ advances=JSON.parse(localStorage.getItem(ADV)||'[]'); if(!Array.isArray(advances)) advances=[]; }catch(e){ advances=[]; }
  function saveAdv(){localStorage.setItem(ADV,JSON.stringify(advances));}
  function fmt(n){return Number(n||0).toLocaleString('vi-VN')+' đ'}
  function esc2(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function monthOf(d){return String(d||'').slice(0,7)}
  function getW(id){return (data.workshops||[]).find(w=>w.id===id)}
  function advMonth(wid,m){return advances.filter(a=>a.workshopId===wid&&monthOf(a.date)===m)}
  function advTotal(wid,m){return advMonth(wid,m).reduce((s,a)=>s+Number(a.amount||0),0)}
  function salaryData(w,m){
    const rows={};
    Object.keys(data.records||{}).forEach(k=>{
      const r=data.records[k]; if(!r || !k.startsWith(w.id+'|') || monthOf(r.date||k.slice(-10))!==m)return;
      const parts=k.split('|'); const name=parts[1];
      if(!rows[name]) rows[name]={name,days:0,pay:0,ot:0,total:0};
      rows[name].days+=1;
      rows[name].pay+=Number(r.wage||0);
      rows[name].ot+=typeof otMoney==='function'?otMoney(r):Number(r.otMoney||0);
    });
    Object.values(rows).forEach(x=>x.total=x.pay+x.ot);
    return Object.values(rows);
  }
  function totalSalary(w,m){return salaryData(w,m).reduce((s,x)=>s+x.total,0)}
  function allAdvForPerson(wid,name,m){return advances.filter(a=>a.workshopId===wid&&a.employee===name&&monthOf(a.date)===m).reduce((s,a)=>s+Number(a.amount||0),0)}

  function addTab(){
    const tabs=document.getElementById('tabs'); if(!tabs)return;
    if(!tabs.querySelector('[data-advance-tab]')){
      const b=document.createElement('button'); b.className='tab'; b.dataset.advanceTab='1'; b.textContent='💸 TẠM ỨNG';
      b.onclick=function(){view='advance'; render();}; tabs.appendChild(b);
    }
    tabs.querySelectorAll('.tab').forEach(b=>{if(b.dataset.advanceTab)b.classList.toggle('active',view==='advance')});
  }

  function renderAdvance(){
    const c=document.getElementById('content'); if(!c)return;
    const w=data.workshops[active]||data.workshops[0]; if(!w){c.innerHTML='<div class="card">Chưa có xưởng.</div>';return;}
    const list=advMonth(w.id,month).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    const total=list.reduce((s,a)=>s+Number(a.amount||0),0);
    c.innerHTML=`<div class="card">
      <div class="bar"><div><div class="title">💸 TẠM ỨNG LƯƠNG</div><div class="hint">Ghi nhận tiền đã ứng cho từng người theo từng xưởng và từng tháng.</div></div>
      <div class="controls"><label>🏭 Xưởng</label><select id="advW">${data.workshops.map(x=>`<option value="${esc2(x.id)}" ${x.id===w.id?'selected':''}>${esc2(x.name)}</option>`).join('')}</select>
      <label>Tháng</label><input id="advM" type="month" value="${month}"></div></div>
      <div class="row"><input id="advName" placeholder="Tên người nhận tạm ứng"><input id="advDate" type="date" value="${month}-01"><input id="advAmount" type="number" min="0" inputmode="numeric" placeholder="Số tiền tạm ứng"><input id="advNote" placeholder="Ghi chú"></div>
      <div class="row"><button class="green" onclick="window.TT_addAdvance()">＋ Lưu tạm ứng</button><button class="gray" onclick="window.TT_clearAdvanceForm()">Xóa nhập</button></div>
      <div class="stats"><div class="stat">Tổng tạm ứng tháng: <b class="money">${fmt(total)}</b></div><div class="stat">Số lượt: <b>${list.length}</b></div></div>
      <div class="tableWrap"><table><thead><tr><th>Ngày</th><th>Người nhận</th><th>Số tiền</th><th>Ghi chú</th><th></th></tr></thead><tbody>${list.length?list.map(a=>`<tr><td>${esc2(a.date)}</td><td class="left">${esc2(a.employee)}</td><td class="money">${fmt(a.amount)}</td><td class="left">${esc2(a.note||'')}</td><td><button class="danger" onclick="window.TT_delAdvance('${a.id}')">Xóa</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">Chưa có tạm ứng trong tháng này.</td></tr>'}</tbody></table></div>
    </div>`;
    document.getElementById('advW').onchange=function(){active=data.workshops.findIndex(x=>x.id===this.value);if(active<0)active=0;render();};
    document.getElementById('advM').onchange=function(){month=this.value;render();};
  }

  window.TT_addAdvance=function(){
    const wid=document.getElementById('advW').value, name=document.getElementById('advName').value.trim(), date=document.getElementById('advDate').value, amount=Number(document.getElementById('advAmount').value||0), note=document.getElementById('advNote').value.trim();
    if(!name)return toast('Nhập tên người nhận tạm ứng');
    if(!date)return toast('Chọn ngày tạm ứng');
    if(amount<=0)return toast('Nhập số tiền tạm ứng');
    advances.push({id:'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),workshopId:wid,employee:name,date,amount,note});
    saveAdv(); month=monthOf(date); active=Math.max(0,data.workshops.findIndex(x=>x.id===wid)); render(); toast('Đã lưu tạm ứng');
  };
  window.TT_delAdvance=function(id){if(!confirm('Xóa khoản tạm ứng này?'))return;advances=advances.filter(a=>a.id!==id);saveAdv();render();toast('Đã xóa tạm ứng');};
  window.TT_clearAdvanceForm=function(){['advName','advAmount','advNote'].forEach(id=>{const e=document.getElementById(id);if(e)e.value=''})};

  function renderSummaryV12(){
    const c=document.getElementById('content'); if(!c)return;
    const rows=data.workshops.map(w=>{const salary=totalSalary(w,month), adv=advTotal(w.id,month), people=salaryData(w,month).length, days=salaryData(w,month).reduce((s,x)=>s+x.days,0);return {w,salary,adv,net:salary-adv,people,days}});
    const grand=rows.reduce((s,x)=>s+x.salary,0), ga=rows.reduce((s,x)=>s+x.adv,0), gn=rows.reduce((s,x)=>s+x.net,0);
    c.innerHTML=`<div class="card summaryBox"><div class="bar"><div><div class="title">💰 TỔNG LƯƠNG</div><div class="hint">Tổng lương theo xưởng, sau khi trừ toàn bộ tạm ứng trong tháng.</div></div><div class="controls"><label>Tháng</label><input id="sumM" type="month" value="${month}"></div></div>
      <div class="stats"><div class="stat">Tổng lương: <b>${fmt(grand)}</b></div><div class="stat">Tạm ứng: <b class="dangerText">${fmt(ga)}</b></div><div class="stat summaryTotal">CÒN PHẢI TRẢ: ${fmt(gn)}</div></div>
      <div class="tableWrap"><table><thead><tr><th>Xưởng</th><th>Số người</th><th>Ngày công</th><th>Tiền công + tăng ca</th><th>Tạm ứng</th><th>Còn phải trả</th></tr></thead><tbody>${rows.map(x=>`<tr><td class="left"><b>${esc2(x.w.name)}</b></td><td>${x.people}</td><td>${x.days}</td><td class="money">${fmt(x.salary)}</td><td>${fmt(x.adv)}</td><td class="summaryTotal">${fmt(x.net)}</td></tr>`).join('')}<tr><th>TỔNG</th><th>${rows.reduce((s,x)=>s+x.people,0)}</th><th>${rows.reduce((s,x)=>s+x.days,0)}</th><th>${fmt(grand)}</th><th>${fmt(ga)}</th><th>${fmt(gn)}</th></tr></tbody></table></div>
    </div>
    <div class="card"><div class="title">👤 Chi tiết theo người</div><div class="tableWrap"><table><thead><tr><th>Xưởng</th><th>Người</th><th>Ngày công</th><th>Lương</th><th>Tạm ứng</th><th>Còn nhận</th></tr></thead><tbody>${rows.flatMap(x=>salaryData(x.w,month).map(p=>{const a=allAdvForPerson(x.w.id,p.name,month);return `<tr><td>${esc2(x.w.name)}</td><td class="left">${esc2(p.name)}</td><td>${p.days}</td><td>${fmt(p.total)}</td><td>${fmt(a)}</td><td class="summaryTotal">${fmt(p.total-a)}</td></tr>`})).join('')||'<tr><td colspan="6" class="empty">Chưa có dữ liệu chấm công.</td></tr>'}</tbody></table></div></div>`;
    document.getElementById('sumM').onchange=function(){month=this.value;render();};
  }

  const originalRender=window.render;
  window.render=function(){
    originalRender();
    addTab();
    if(view==='advance')renderAdvance();
    if(view==='summary')renderSummaryV12();
  };
  setTimeout(function(){addTab();if(view==='summary')renderSummaryV12();},0);
})();
</script>
<script src="v12.js"></script>
</body>
</html>
