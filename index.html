<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TT - Bảng chấm công</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#17212b;font-family:Arial,Helvetica,sans-serif}.app{max-width:1400px;margin:auto;padding:10px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 10px}.top h2{margin:0;font-size:21px}.clock{font-size:13px;font-weight:700}.tabs{display:flex;gap:7px;overflow-x:auto;position:sticky;top:0;z-index:20;background:#f3f6fa;padding:4px 0 9px}.tab{flex:0 0 auto;border:0;border-radius:12px;padding:11px 15px;background:#e2e8f0;color:#334155;font-weight:700;white-space:nowrap}.tab.active{background:#1677ff;color:#fff}.tab.add{background:#087443;color:#fff}.card{background:#fff;border-radius:15px;padding:13px;margin:9px 0;box-shadow:0 2px 12px #0f172a14}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}button,input,select{font:inherit;border:1px solid #ccd6e2;border-radius:10px;padding:9px 10px;background:#fff}button{border:0;background:#1677ff;color:#fff;font-weight:700;cursor:pointer}.green{background:#087443}.gray{background:#667085}.orange{background:#d97706}.danger{background:#b42318}.small{font-size:12px;padding:7px 9px}.hint{font-size:13px;color:#667085}.title{font-size:20px;font-weight:800}.money{color:#087443;font-weight:800}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.stat{padding:9px 12px;border-radius:11px;background:#f7f9fc}.employees{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:9px}.employee{border:1px solid #dbe3ee;border-radius:14px;padding:12px}.employeeTop{display:flex;justify-content:space-between;gap:8px}.employeeName{font-weight:800}.status{min-height:18px;margin-top:7px;font-size:12px;color:#667085}.punch{width:100%;margin-top:9px;padding:13px;font-size:16px}.tableWrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:980px}th,td{border:1px solid #d9e1ea;padding:6px;text-align:center;font-size:12px}th{background:#edf3fa;font-weight:800}.left{text-align:left}.today{background:#fff5d6}.worked{background:#e8f7ed}.construction{background:#fff0d8}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:14px;z-index:100}.modal.show{display:flex}.box{width:min(480px,100%);background:#fff;border-radius:18px;padding:18px}.box h3{margin:0 0 12px}.row{display:flex;gap:8px;margin:8px 0}.row>*{flex:1;min-width:0}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#17212b;color:#fff;padding:10px 15px;border-radius:12px;display:none;z-index:200}.toast.show{display:block}.empty{text-align:center;color:#98a2b3;padding:20px}.grid td:first-child,.grid th:first-child{position:sticky;left:0;background:#fff;z-index:3}.grid th:first-child{background:#edf3fa}.daycell{min-width:72px;height:55px;cursor:pointer}.daynum{font-weight:800}.times{font-size:10px;color:#475467}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px}.legend span{padding:5px 8px;border-radius:7px}.modalBtns{display:flex;gap:8px;flex-wrap:wrap}.modalBtns button{flex:1}@media(max-width:600px){.app{padding:8px}.top h2{font-size:18px}.employees{grid-template-columns:1fr}.title{font-size:18px}.row{flex-direction:column}.row button{width:100%}}@media print{body{background:#fff}.noPrint{display:none!important}.app{max-width:none;padding:0}.card{box-shadow:none;padding:4px;margin:0 0 6px}.tableWrap{overflow:visible}table{min-width:0;width:100%}th,td{font-size:8px;padding:3px}}
</style>
</head>
<body>
<div class="app"><div class="top noPrint"><h2>🕘 TT - BẢNG CHẤM CÔNG</h2><div id="clock"></div></div><div id="tabs" class="tabs noPrint"></div><div id="content"></div></div>
<div id="workshopModal" class="modal"><div class="box"><h3>🏭 Thêm / sửa xưởng</h3><div class="row"><input id="wName" placeholder="Tên xưởng"></div><div class="row"><input id="wPay" type="number" min="0" inputmode="numeric" placeholder="Tiền công/ngày (VNĐ)"></div><div class="modalBtns"><button onclick="saveWorkshop()">Lưu</button><button class="gray" onclick="closeM('workshopModal')">Hủy</button></div></div></div>
<div id="employeeModal" class="modal"><div class="box"><h3>👷 Thêm nhân viên</h3><div class="row"><input id="eName" placeholder="Tên nhân viên"></div><div class="modalBtns"><button onclick="saveEmployee()">Thêm</button><button class="gray" onclick="closeM('employeeModal')">Hủy</button></div></div></div>
<div id="punchModal" class="modal"><div class="box"><h3 id="punchTitle">🟢 Chấm công</h3><div class="row"><select id="pType" onchange="toggleProject()"><option value="xuong">🏭 Làm tại xưởng</option><option value="congtrinh">🏗 Đi công trình</option></select></div><div class="row"><input id="pProject" placeholder="Tên công trình" style="display:none"></div><div class="hint">Lần 1 ghi giờ vào. Lần 2 ghi giờ ra. Chấm lại sau khi đủ ca sẽ mở ca mới.</div><div class="modalBtns"><button onclick="doPunch()">Xác nhận</button><button class="gray" onclick="closeM('punchModal')">Hủy</button></div></div></div>
<div id="editModal" class="modal"><div class="box"><h3>✏️ Sửa ngày công</h3><div id="editInfo" class="hint"></div><div class="row"><input id="editIn" type="time" step="1"><input id="editOut" type="time" step="1"></div><div class="row"><select id="editType" onchange="toggleEditProject()"><option value="xuong">🏭 Xưởng</option><option value="congtrinh">🏗 Công trình</option></select></div><div class="row"><input id="editProject" placeholder="Tên công trình"></div><div class="modalBtns"><button onclick="saveEdit()">Lưu</button><button class="danger" onclick="removeEdit()">Xóa</button><button class="gray" onclick="closeM('editModal')">Hủy</button></div></div></div><div id="toast" class="toast"></div>
<script>
const KEY='TT_CC_V8';
let data=load(),active=0,month=new Date().toISOString().slice(0,7),punchEmp='',editKey='';
function uid(){return 'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function load(){let d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&Array.isArray(d.workshops))return d;let old=JSON.parse(localStorage.getItem('TT_CC_V7')||localStorage.getItem('TT_CC_V6')||localStorage.getItem('TT_CC_V5')||localStorage.getItem('TT_CC_V4')||'null');let x={workshops:[],records:{}};if(old&&Array.isArray(old.workshops)&&old.workshops.length){x.workshops=old.workshops.map(w=>({id:w.id||uid(),name:w.name||'Xưởng',pay:Number(w.pay)||0,employees:Array.isArray(w.employees)?w.employees:[]}));Object.keys(old.records||{}).forEach(k=>{let a=k.split('|'),emp=a[1]||a[0],date=a[2]||a[1],w=x.workshops.find(q=>q.name===(old.records[k].workshop||''))||x.workshops[0];if(w){if(!w.employees.includes(emp))w.employees.push(emp);x.records[w.id+'|'+emp+'|'+date]={...old.records[k]}}})}else{x.workshops=[{id:uid(),name:'Xưởng 1',pay:0,employees:[]}]};localStorage.setItem(KEY,JSON.stringify(x));return x}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return Number(n||0).toLocaleString('vi-VN')+' đ'}function pad(n){return String(n).padStart(2,'0')}function dateKey(y,m,d){return y+'-'+pad(m)+'-'+pad(d)}function today(){let x=new Date();return dateKey(x.getFullYear(),x.getMonth()+1,x.getDate())}function now(){let x=new Date();return pad(x.getHours())+':'+pad(x.getMinutes())+':'+pad(x.getSeconds())}function key(wi,e,dt){return data.workshops[wi].id+'|'+e+'|'+dt}function rec(wi,e,dt){return data.records[key(wi,e,dt)]||null}function hrs(a,b){if(!a||!b)return 0;let A=a.split(':').map(Number),B=b.split(':').map(Number),v=(B[0]*3600+B[1]*60+(B[2]||0))-(A[0]*3600+A[1]*60+(A[2]||0));if(v<0)v+=86400;return v/3600}function notify(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}function closeM(id){document.getElementById(id).classList.remove('show')}function openM(id){document.getElementById(id).classList.add('show')}
function renderTabs(){let h=data.workshops.map((w,i)=>'<button class="tab '+(i===active?'active':'')+'" onclick="active='+i+';render()">🏭 '+esc(w.name)+'</button>').join('');h+='<button class="tab add" onclick="newWorkshop()">＋ Thêm xưởng</button>';document.getElementById('tabs').innerHTML=h}
function newWorkshop(){document.getElementById('wName').value='';document.getElementById('wPay').value='';document.getElementById('workshopModal').dataset.edit='';openM('workshopModal')}function editWorkshop(){let w=data.workshops[active];document.getElementById('wName').value=w.name;document.getElementById('wPay').value=w.pay;document.getElementById('workshopModal').dataset.edit='1';openM('workshopModal')}function saveWorkshop(){let n=document.getElementById('wName').value.trim(),p=Number(document.getElementById('wPay').value||0),edit=document.getElementById('workshopModal').dataset.edit;if(!n)return notify('Nhập tên xưởng');if(edit){data.workshops[active].name=n;data.workshops[active].pay=p}else{data.workshops.push({id:uid(),name:n,pay:p,employees:[]});active=data.workshops.length-1}save();closeM('workshopModal');notify('Đã lưu xưởng')}function deleteWorkshop(){if(data.workshops.length===1)return notify('Phải giữ lại ít nhất 1 xưởng');let w=data.workshops[active];if(!confirm('Xóa '+w.name+' và toàn bộ chấm công của xưởng này?'))return;Object.keys(data.records).forEach(k=>{if(k.startsWith(w.id+'|'))delete data.records[k]});data.workshops.splice(active,1);active=Math.max(0,active-1);save()}
function addEmployee(){document.getElementById('eName').value='';openM('employeeModal')}function saveEmployee(){let n=document.getElementById('eName').value.trim(),w=data.workshops[active];if(!n)return notify('Nhập tên nhân viên');if(w.employees.some(x=>x.toLowerCase()===n.toLowerCase()))return notify('Nhân viên đã tồn tại');w.employees.push(n);save();closeM('employeeModal')}function renameEmployee(i){let w=data.workshops[active],old=w.employees[i],n=prompt('Tên nhân viên:',old);if(n===null)return;n=n.trim();if(!n||n===old)return;if(w.employees.includes(n))return notify('Tên đã tồn tại');Object.keys(data.records).forEach(k=>{let pre=w.id+'|'+old+'|';if(k.startsWith(pre)){let v=data.records[k],d=k.slice(pre.length);delete data.records[k];data.records[w.id+'|'+n+'|'+d]=v}});w.employees[i]=n;save()}function removeEmployee(i){let w=data.workshops[active],n=w.employees[i];if(!confirm('Xóa '+n+'?'))return;w.employees.splice(i,1);save()}
function openPunch(emp){punchEmp=emp;let r=rec(active,emp,today());document.getElementById('punchTitle').textContent='🟢 '+emp+' · '+data.workshops[active].name;document.getElementById('pType').value=r&&r.type?r.type:'xuong';document.getElementById('pProject').value=r&&r.project?r.project:'';toggleProject();openM('punchModal')}function toggleProject(){document.getElementById('pProject').style.display=document.getElementById('pType').value==='congtrinh'?'block':'none'}function doPunch(){let type=document.getElementById('pType').value,project=document.getElementById('pProject').value.trim();if(type==='congtrinh'&&!project)return notify('Nhập tên công trình');let k=key(active,punchEmp,today()),r=data.records[k];if(!r){data.records[k]={in:now(),out:'',type:type,project:project};notify('Đã ghi giờ vào')}else if(!r.out){r.out=now();notify('Đã ghi giờ ra')}else{data.records[k]={in:now(),out:'',type:type,project:project};notify('Bắt đầu ca mới')}save();closeM('punchModal')}
function openEdit(emp,dt){editKey=key(active,emp,dt);let r=data.records[editKey]||{};document.getElementById('editInfo').textContent=emp+' · '+data.workshops[active].name+' · '+dt;document.getElementById('editIn').value=r.in||'';document.getElementById('editOut').value=r.out||'';document.getElementById('editType').value=r.type||'xuong';document.getElementById('editProject').value=r.project||'';toggleEditProject();openM('editModal')}function toggleEditProject(){document.getElementById('editProject').style.display=document.getElementById('editType').value==='congtrinh'?'block':'none'}function saveEdit(){let type=document.getElementById('editType').value,project=document.getElementById('editProject').value.trim();if(type==='congtrinh'&&!project)return notify('Nhập tên công trình');data.records[editKey]={in:document.getElementById('editIn').value,out:document.getElementById('editOut').value,type:type,project:project};save();closeM('editModal');notify('Đã lưu')}function removeEdit(){if(!confirm('Xóa ngày công này?'))return;delete data.records[editKey];save();closeM('editModal')}
function render(){renderTabs();if(!data.workshops.length)return;let w=data.workshops[active],[Y,M]=month.split('-').map(Number),days=new Date(Y,M,0).getDate(),totalD=0,totalH=0,totalP=0;let cards='';w.employees.forEach((emp,i)=>{let d=0,h=0,p=0;for(let n=1;n<=days;n++){let r=rec(active,emp,dateKey(Y,M,n));if(r){d++;h+=hrs(r.in,r.out);if(r.type==='xuong')p+=w.pay}}totalD+=d;totalH+=h;totalP+=p;let r=rec(active,emp,today()),st=r?(r.out?'Đã ra · '+r.in+' → '+r.out:'Đang làm · vào '+r.in):'Chưa chấm hôm nay';cards+='<div class="employee"><div class="employeeTop"><span class="employeeName">👤 '+esc(emp)+'</span><span class="money">'+money(w.pay)+'</span></div><div class="status">'+esc(st)+'</div><button class="punch green" onclick="openPunch('+JSON.stringify(emp)+')">🟢 CHẤM CÔNG</button><div class="controls" style="margin-top:6px"><button class="small orange" onclick="renameEmployee('+i+')">Đổi tên</button><button class="small danger" onclick="removeEmployee('+i+')">Xóa</button></div></div>'});let head='<tr><th>Nhân viên</th>';for(let n=1;n<=days;n++)head+='<th>'+pad(n)+'</th>';head+='</tr>';let grid='';w.employees.forEach(emp=>{grid+='<tr><td class="left"><b>'+esc(emp)+'</b></td>';for(let n=1;n<=days;n++){let dt=dateKey(Y,M,n),r=rec(active,emp,dt),cl='daycell';if(dt===today())cl+=' today';if(r)cl+=r.type==='congtrinh'?' construction':' worked';let text=r?(r.type==='congtrinh'?'CT':'X'):'—';let sub=r?((r.in||'')+' '+(r.out||'')):' ';grid+='<td class="'+cl+'" onclick="openEdit('+JSON.stringify(emp)+','+JSON.stringify(dt)+')"><div class="daynum">'+text+'</div><div class="times">'+esc(sub)+'</div></td>'}grid+='</tr>'});let rows='';for(let n=1;n<=days;n++){let dt=dateKey(Y,M,n);w.employees.forEach(emp=>{let r=rec(active,emp,dt);if(!r)return;let h=hrs(r.in,r.out),p=r.type==='xuong'?w.pay:0;rows+='<tr><td>'+dt+'</td><td class="left">'+esc(emp)+'</td><td>'+(r.type==='congtrinh'?'🏗 Công trình':'🏭 '+esc(w.name))+'</td><td>'+esc(r.project||'')+'</td><td>'+esc(r.in||'')+'</td><td>'+esc(r.out||'')+'</td><td>'+h.toFixed(2)+'</td><td>'+money(p)+'</td><td class="noPrint"><button class="small gray" onclick="openEdit('+JSON.stringify(emp)+','+JSON.stringify(dt)+')">Sửa</button></td></tr>'})}document.getElementById('content').innerHTML='<div class="card"><div class="bar"><div><div class="title">🏭 '+esc(w.name)+'</div><div class="money">Tiền công: '+money(w.pay)+'/ngày</div></div><div class="controls noPrint"><button class="orange" onclick="editWorkshop()">⚙️ Sửa xưởng</button><button class="danger" onclick="deleteWorkshop()">Xóa xưởng</button></div></div><div class="stats"><span class="stat">👥 '+w.employees.length+' NV</span><span class="stat">📅 '+pad(M)+'/'+Y+'</span><span class="stat">✅ '+totalD+' ngày</span><span class="stat">⏱ '+totalH.toFixed(2)+' giờ</span><span class="stat">💰 '+money(totalP)+'</span></div></div><div class="card noPrint"><div class="bar"><div><b>Chấm công tại '+esc(w.name)+'</b><div class="hint">Chọn nhân viên → CHẤM CÔNG</div></div><div class="controls"><input type="month" value="'+month+'" onchange="month=this.value;render()"><button class="green" onclick="addEmployee()">＋ Thêm nhân viên</button><button onclick="printPDF()">🖨️ Xuất PDF</button></div></div></div><div class="card noPrint"><div class="employees">'+(cards||'<div class="empty">Chưa có nhân viên.</div>')+'</div></div><div class="card"><div class="bar"><b>📅 Bảng theo ngày 01 → '+pad(days)+'</b><div class="legend"><span class="worked">X = Xưởng</span><span class="construction">CT = Công trình</span><span>Chạm ô để sửa</span></div></div><div class="tableWrap"><table class="grid"><thead>'+head+'</thead><tbody>'+(grid||'<tr><td colspan="99" class="empty">Chưa có nhân viên.</td></tr>')+'</tbody></table></div></div><div class="card"><div class="bar"><b>📋 Chi tiết ngày đã làm</b><button class="noPrint" onclick="printPDF()">🖨️ Xuất bảng PDF</button></div><div class="tableWrap"><table><thead><tr><th>Ngày</th><th>Nhân viên</th><th>Nơi làm</th><th>Xưởng / Công trình</th><th>Vào</th><th>Ra</th><th>Giờ</th><th>Tiền</th><th class="noPrint">Sửa</th></tr></thead><tbody>'+(rows||'<tr><td colspan="9" class="empty">Chưa có dữ liệu.</td></tr>')+'</tbody></table></div></div>'}
function printPDF(){let w=data.workshops[active],[Y,M]=month.split('-').map(Number),days=new Date(Y,M,0).getDate(),rows='',totalD=0,totalH=0,totalP=0;w.employees.forEach(emp=>{for(let n=1;n<=days;n++){let dt=dateKey(Y,M,n),r=rec(active,emp,dt);if(!r)continue;let h=hrs(r.in,r.out),p=r.type==='xuong'?w.pay:0;totalD++;totalH+=h;totalP+=p;rows+='<tr><td>'+dt+'</td><td>'+esc(emp)+'</td><td>'+(r.type==='congtrinh'?'Công trình':'Xưởng')+'</td><td>'+esc(r.type==='congtrinh'?r.project||'':w.name)+'</td><td>'+esc(r.in||'')+'</td><td>'+esc(r.out||'')+'</td><td>'+h.toFixed(2)+'</td><td>'+money(p)+'</td></tr>'}});let win=window.open('','_blank');if(!win)return notify('Hãy cho phép mở cửa sổ mới để xuất PDF');let html='<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>TT - Bang cham cong</title><style>@page{size:A4 landscape;margin:10mm}body{font-family:Arial,Helvetica,sans-serif;font-size:10px;color:#111;margin:0}h1{font-size:18px;margin:0 0 4px}h2{font-size:13px;margin:0 0 8px}.summary{margin:8px 0;font-weight:bold}table{width:100%;border-collapse:collapse}th,td{border:1px solid #555;padding:4px;text-align:center}th{background:#e9eef5}td:nth-child(2),td:nth-child(4){text-align:left}.sign{display:flex;justify-content:space-between;margin-top:20px;text-align:center}.sig{width:220px}</style></head><body><h1>TT - BẢNG CHẤM CÔNG</h1><h2>'+esc(w.name)+' · Tháng '+pad(M)+'/'+Y+'</h2><div class="summary">Tiền công xưởng: '+money(w.pay)+'/ngày &nbsp; | &nbsp; Ngày công: '+totalD+' &nbsp; | &nbsp; Tổng giờ: '+totalH.toFixed(2)+' &nbsp; | &nbsp; Tổng tiền: '+money(totalP)+'</div><table><thead><tr><th>Ngày</th><th>Nhân viên</th><th>Nơi làm</th><th>Xưởng / Công trình</th><th>Giờ vào</th><th>Giờ ra</th><th>Số giờ</th><th>Tiền công</th></tr></thead><tbody>'+(rows||'<tr><td colspan="8">Không có dữ liệu</td></tr>')+'</tbody></table><div class="sign"><div class="sig">Người lập bảng<br><br><br>________________</div><div class="sig">Người duyệt<br><br><br>________________</div></div></body></html>';win.document.open();win.document.write(html);win.document.close();setTimeout(function(){try{win.focus();win.print()}catch(e){}},500)}
setInterval(function(){document.getElementById('clock').textContent=new Date().toLocaleString('vi-VN',{hour12:false})},1000);render();
</script>
</body></html>
