<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>TT - Bảng chấm công</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#182230}.app{max-width:1400px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.top h2{margin:8px 0}.clock{font-weight:bold}.tabs{display:flex;gap:8px;margin:10px 0}.tab{flex:1;max-width:220px;padding:12px;border:0;border-radius:12px;background:#e4eaf2;color:#344054;font-weight:bold}.tab.active{background:#1677ff;color:#fff}.panel{display:none}.panel.active{display:block}.card{background:#fff;border-radius:14px;padding:13px;margin:10px 0;box-shadow:0 2px 12px #0001}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,input,select{font:inherit;border:1px solid #ccd6e2;border-radius:9px;padding:10px;background:#fff}button{cursor:pointer;background:#1677ff;color:#fff;border:0;font-weight:bold}.gray{background:#667085}.red{background:#d83c3c}.green{background:#087443}.orange{background:#d97706}.danger{background:#b42318}.small{padding:6px 8px;font-size:12px;margin:2px}.hint{font-size:13px;color:#667085}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:#f7f9fc;border-radius:10px;padding:9px 12px}.wrap{overflow:auto;border-radius:10px}table{border-collapse:separate;border-spacing:0;min-width:1100px;width:100%}th,td{border-right:1px solid #dbe3ee;border-bottom:1px solid #dbe3ee;text-align:center;padding:7px}th{background:#edf3fa;position:sticky;top:0;z-index:2}.name{position:sticky;left:0;z-index:3;background:#fff;text-align:left;min-width:180px;font-weight:bold}.day{min-width:105px;height:92px}.today{background:#eef6ff!important;box-shadow:inset 0 0 0 2px #1677ff}.in{color:#087443;font-weight:bold;font-size:12px}.out{color:#c62828;font-weight:bold;font-size:12px}.place{font-size:11px;color:#475467;margin:3px}.hours{font-size:11px;color:#475467}.empty{color:#98a2b3;font-size:12px}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.show{display:flex}.box{background:#fff;width:min(460px,100%);border-radius:16px;padding:18px}.box h3{margin-top:0}.row{display:flex;gap:8px;margin:8px 0}.row>*{flex:1}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#182230;color:#fff;padding:10px 15px;border-radius:10px;display:none;z-index:30}.toast.show{display:block}.workshop{border:1px solid #dbe3ee;border-radius:12px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}.money{font-weight:bold;color:#087443}@media(max-width:600px){.app{padding:8px}.top h2{font-size:19px}.tabs{position:sticky;top:0;z-index:10;background:#f3f6fa;padding:5px 0}.tab{font-size:13px}.controls>*{width:100%}.controls button{width:auto}.stats .stat{flex:1}.box{padding:15px}}
</style>
</head>
<body>
<div class="app">
<div class="top"><h2>🕘 TT - BẢNG CHẤM CÔNG</h2><div class="clock" id="clock"></div></div>
<div class="tabs"><button class="tab active" id="tabCham" onclick="showTab('cham')">🕘 Chấm công</button><button class="tab" id="tabXuong" onclick="showTab('xuong')">🏭 Thêm xưởng</button></div>

<section id="cham" class="panel active">
<div class="card"><div class="controls"><button class="green" onclick="openQuick()">🟢 CHẤM CÔNG HÔM NAY</button><input id="month" type="month"><button class="gray" onclick="exportCSV()">📄 Xuất Excel/CSV</button><button class="red" onclick="clearAll()">🗑 Xóa toàn bộ</button></div><div class="hint" id="today"></div></div>
<div class="card"><div class="controls"><input id="name" placeholder="Tên nhân viên mới" onkeydown="if(event.key==='Enter')addEmployee()"><button onclick="addEmployee()">＋ Thêm nhân viên</button><button class="gray" onclick="openManage()">👥 Nhân viên</button></div></div>
<div class="card"><div class="stats" id="stats"></div></div>
<div class="card"><div class="wrap"><table id="table"></table></div></div>
</section>

<section id="xuong" class="panel">
<div class="card"><h3>🏭 Danh sách xưởng</h3><div class="hint">Chỉ cần khai báo tên xưởng và tiền công/ngày. Khi chấm công, chọn xưởng tương ứng.</div><div class="controls" style="margin-top:10px"><input id="workshopName" placeholder="Tên xưởng"><input id="workshopPay" type="number" min="0" placeholder="Tiền công/ngày (VNĐ)"><button onclick="addWorkshop()">＋ Thêm xưởng</button></div></div>
<div class="card" id="workshopList"></div>
</section>

<div class="modal" id="quickModal" onclick="if(event.target===this)closeModal('quickModal')"><div class="box"><h3>🟢 Chấm công hôm nay</h3><div class="row"><select id="quickEmployee"></select></div><div class="row"><select id="quickPlaceType"><option value="xuong">🏭 Xưởng</option><option value="congtrinh">🏗 Công trình</option></select></div><div class="row"><select id="quickWorkshop"></select><input id="quickProject" placeholder="Tên công trình (nếu có)"></div><p class="hint">Lần 1 = giờ vào · Lần 2 = giờ ra. Chấm lại sau khi đã ra sẽ bắt đầu ca mới.</p><div class="row"><button onclick="quickPunch()">Xác nhận chấm</button><button class="gray" onclick="closeModal('quickModal')">Đóng</button></div></div></div>
<div class="modal" id="manageModal" onclick="if(event.target===this)closeModal('manageModal')"><div class="box"><h3>👥 Nhân viên</h3><div id="employeeList"></div><div class="row"><button class="gray" onclick="closeModal('manageModal')">Đóng</button></div></div></div>
<div class="modal" id="editModal" onclick="if(event.target===this)closeModal('editModal')"><div class="box"><h3>✏️ Sửa chấm công</h3><div class="hint" id="editTitle"></div><div class="row"><input id="editIn" type="time" step="1"><input id="editOut" type="time" step="1"></div><div class="row"><select id="editWorkshop"></select><input id="editProject" placeholder="Tên công trình"></div><div class="row"><button onclick="saveEdit()">Lưu</button><button class="danger" onclick="deleteRecord()">Xóa ngày này</button><button class="gray" onclick="closeModal('editModal')">Hủy</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY='TT_CC_V5';
let data=JSON.parse(localStorage.getItem(KEY)||'null');
if(!data){let old=JSON.parse(localStorage.getItem('TT_CC_V4')||'null');data={employees:old&&old.employees?old.employees:[],records:old&&old.records?old.records:{},workshops:[]};}
if(!data.workshops)data.workshops=[];let editKey=null;
const month=document.getElementById('month');let n0=new Date();month.value=n0.getFullYear()+'-'+String(n0.getMonth()+1).padStart(2,'0');
function pad(n){return String(n).padStart(2,'0')}function dateKey(y,m,d){return y+'-'+pad(m)+'-'+pad(d)}function todayKey(){let x=new Date();return dateKey(x.getFullYear(),x.getMonth()+1,x.getDate())}function timeNow(){let x=new Date();return pad(x.getHours())+':'+pad(x.getMinutes())+':'+pad(x.getSeconds())}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(v){return Number(v||0).toLocaleString('vi-VN')+' đ'}function save(){localStorage.setItem(KEY,JSON.stringify(data));render();renderWorkshops()}function notify(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function showTab(t){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(t).classList.add('active');document.getElementById(t==='cham'?'tabCham':'tabXuong').classList.add('active');if(t==='xuong')renderWorkshops()}
function addEmployee(){let n=document.getElementById('name').value.trim();if(!n)return notify('Nhập tên nhân viên');if(data.employees.some(x=>x.toLowerCase()===n.toLowerCase()))return notify('Nhân viên đã tồn tại');data.employees.push(n);document.getElementById('name').value='';save();notify('Đã thêm nhân viên')}
function removeEmployee(i){let n=data.employees[i];if(!confirm('Xóa nhân viên '+n+'?'))return;Object.keys(data.records).forEach(k=>{if(k.startsWith(n+'|'))delete data.records[k]});data.employees.splice(i,1);save();openManage()}
function renameEmployee(i){let old=data.employees[i],n=prompt('Tên mới:',old);if(n===null)return;n=n.trim();if(!n||n===old)return;if(data.employees.includes(n))return notify('Tên đã tồn tại');Object.keys(data.records).forEach(k=>{if(k.startsWith(old+'|')){let v=data.records[k];delete data.records[k];data.records[n+k.slice(old.length)]=v}});data.employees[i]=n;save();openManage()}
function addWorkshop(){let n=document.getElementById('workshopName').value.trim(),p=Number(document.getElementById('workshopPay').value||0);if(!n)return notify('Nhập tên xưởng');if(data.workshops.some(x=>x.name.toLowerCase()===n.toLowerCase()))return notify('Xưởng đã tồn tại');data.workshops.push({name:n,pay:p});document.getElementById('workshopName').value='';document.getElementById('workshopPay').value='';save();notify('Đã thêm xưởng')}
function editWorkshop(i){let w=data.workshops[i],n=prompt('Tên xưởng:',w.name);if(n===null)return;let p=prompt('Tiền công/ngày (VNĐ):',w.pay);if(p===null)return;n=n.trim();if(!n)return;data.workshops[i]={name:n,pay:Number(p)||0};save();notify('Đã cập nhật xưởng')}
function deleteWorkshop(i){if(!confirm('Xóa xưởng này? Dữ liệu chấm công cũ vẫn giữ tên xưởng.'))return;data.workshops.splice(i,1);save();notify('Đã xóa xưởng')}
function renderWorkshops(){let e=document.getElementById('workshopList');if(!data.workshops.length){e.innerHTML='<div class="hint">Chưa có xưởng. Hãy thêm xưởng ở phía trên.</div>';return}e.innerHTML=data.workshops.map((w,i)=>'<div class="workshop"><div><b>🏭 '+esc(w.name)+'</b><div class="money">'+money(w.pay)+'/ngày</div></div><div><button class="small orange" onclick="editWorkshop('+i+')">Sửa</button><button class="small danger" onclick="deleteWorkshop('+i+')">Xóa</button></div></div>').join('')}
function punch(name,k,type='xuong',workshop='',project=''){let key=name+'|'+k,x=data.records[key]||{};if(!x.in){x.in=timeNow();x.type=type;x.workshop=workshop;x.project=project;notify('Đã ghi giờ vào')}else if(!x.out){x.out=timeNow();notify('Đã ghi giờ ra')}else{x={in:timeNow(),out:'',type:type,workshop:workshop,project:project};notify('Bắt đầu ca mới')}data.records[key]=x;save()}
function openQuick(){if(!data.employees.length)return notify('Hãy thêm nhân viên trước');document.getElementById('quickEmployee').innerHTML=data.employees.map((n,i)=>'<option value="'+i+'">'+esc(n)+'</option>').join('');document.getElementById('quickWorkshop').innerHTML='<option value="">-- Chọn xưởng --</option>'+data.workshops.map((w,i)=>'<option value="'+i+'">🏭 '+esc(w.name)+' · '+money(w.pay)+'/ngày</option>').join('');document.getElementById('quickProject').style.display='none';document.getElementById('quickWorkshop').style.display='block';document.getElementById('quickPlaceType').onchange=function(){let c=this.value==='xuong';document.getElementById('quickWorkshop').style.display=c?'block':'none';document.getElementById('quickProject').style.display=c?'none':'block'};document.getElementById('quickModal').classList.add('show')}
function quickPunch(){let i=+document.getElementById('quickEmployee').value,n=data.employees[i],type=document.getElementById('quickPlaceType').value,wi=document.getElementById('quickWorkshop').value,w=wi===''?'':data.workshops[+wi]?.name||'',project=document.getElementById('quickProject').value.trim();if(type==='xuong'&&!w)return notify('Chọn xưởng');if(type==='congtrinh'&&!project)return notify('Nhập tên công trình');punch(n,todayKey(),type,w,project);closeModal('quickModal')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function openManage(){let b=document.getElementById('employeeList');b.innerHTML=data.employees.length?data.employees.map((n,i)=>'<div class="row"><input value="'+esc(n)+'" readonly><button class="small orange" onclick="renameEmployee('+i+')">Đổi tên</button><button class="small danger" onclick="removeEmployee('+i+')">Xóa</button></div>').join(''):'<p class="hint">Chưa có nhân viên.</p>';document.getElementById('manageModal').classList.add('show')}
function diffHours(a,b){if(!a||!b)return '';let A=a.split(':').map(Number),B=b.split(':').map(Number),x=(B[0]*3600+B[1]*60+(B[2]||0))-(A[0]*3600+A[1]*60+(A[2]||0));if(x<0)x+=86400;return x/3600}
function openEdit(name,k){editKey=name+'|'+k;let x=data.records[editKey]||{};document.getElementById('editTitle').textContent=name+' · '+k;document.getElementById('editIn').value=x.in||'';document.getElementById('editOut').value=x.out||'';document.getElementById('editProject').value=x.project||'';document.getElementById('editWorkshop').innerHTML='<option value="">-- Không chọn --</option>'+data.workshops.map((w,i)=>'<option value="'+i+'">'+esc(w.name)+'</option>').join('');let wi=data.workshops.findIndex(w=>w.name===x.workshop);document.getElementById('editWorkshop').value=wi>=0?wi:'';document.getElementById('editModal').classList.add('show')}
function saveEdit(){let a=document.getElementById('editIn').value,b=document.getElementById('editOut').value;if(!a&&!b)return deleteRecord();let wi=document.getElementById('editWorkshop').value,w=wi===''?'':data.workshops[+wi]?.name||'';data.records[editKey]={in:a,out:b,workshop:w,project:document.getElementById('editProject').value.trim(),type:w?'xuong':'congtrinh'};save();closeModal('editModal');notify('Đã lưu')}
function deleteRecord(){if(!editKey)return;if(!confirm('Xóa chấm công ngày này?'))return;delete data.records[editKey];save();closeModal('editModal');notify('Đã xóa')}
function render(){let [Y,M]=month.value.split('-').map(Number),days=new Date(Y,M,0).getDate(),tk=todayKey(),h='<thead><tr><th>NHÂN VIÊN</th>';for(let i=1;i<=days;i++)h+='<th>'+pad(i)+'/'+pad(M)+'</th>';h+='<th>TỔNG NGÀY</th><th>TỔNG LƯƠNG</th></tr></thead><tbody>';let totalDays=0,totalPay=0;for(let n of data.employees){let c=0,pay=0;h+='<tr><td class="name">'+esc(n)+'</td>';for(let i=1;i<=days;i++){let k=dateKey(Y,M,i),x=data.records[n+'|'+k],q=k===tk?'today':'';if(x){c++;let w=data.workshops.find(z=>z.name===x.workshop),dayPay=w?w.pay:0;pay+=dayPay;let dh=diffHours(x.in,x.out);h+='<td class="day '+q+'"><b>'+i+'/'+M+'</b><div class="in">Vào '+esc(x.in||'--')+'</div><div class="out">Ra '+esc(x.out||'--')+'</div><div class="place">'+(x.type==='congtrinh'?'🏗 '+esc(x.project||'Công trình'):'🏭 '+esc(x.workshop||'Chưa chọn xưởng'))+'</div><div class="hours">'+(dh!==''?dh.toFixed(2)+' giờ':'Chưa đủ ca')+(dayPay?' · '+money(dayPay):'')+'</div><button class="small gray" onclick="openEdit('+JSON.stringify(n)+','+JSON.stringify(k)+')">Sửa</button></td>'}else h+='<td class="day '+q+'"><b>'+i+'/'+M+'</b><br><button class="small" onclick="openEditNew('+JSON.stringify(n)+','+JSON.stringify(k)+')">Chấm</button></td>'}totalDays+=c;totalPay+=pay;h+='<td><b>'+c+'</b></td><td><b>'+money(pay)+'</b></td></tr>'}if(!data.employees.length)h+='<tr><td colspan="40" class="empty">Chưa có nhân viên</td></tr>';document.getElementById('table').innerHTML=h+'</tbody>';document.getElementById('today').textContent='Hôm nay: '+new Date().toLocaleDateString('vi-VN')+' · Chấm tại xưởng hoặc công trình';document.getElementById('stats').innerHTML='<span class="stat">👥 Nhân viên <b>'+data.employees.length+'</b></span><span class="stat">📅 Tháng '+M+'/'+Y+'</span><span class="stat">✅ Ngày công <b>'+totalDays+'</b></span><span class="stat">💰 Tổng lương <b>'+money(totalPay)+'</b></span>'}
function openEditNew(n,k){editKey=n+'|'+k;document.getElementById('editTitle').textContent=n+' · '+k;document.getElementById('editIn').value='';document.getElementById('editOut').value='';document.getElementById('editProject').value='';document.getElementById('editWorkshop').innerHTML='<option value="">-- Không chọn --</option>'+data.workshops.map((w,i)=>'<option value="'+i+'">'+esc(w.name)+'</option>').join('');document.getElementById('editModal').classList.add('show')}
function exportCSV(){let [Y,M]=month.value.split('-').map(Number),days=new Date(Y,M,0).getDate(),rows=[['Nhân viên',...Array.from({length:days},(_,i)=>(i+1)+'/'+M),'Tổng ngày','Tổng lương']];for(let n of data.employees){let row=[n],c=0,pay=0;for(let i=1;i<=days;i++){let x=data.records[n+'|'+dateKey(Y,M,i)];if(x){c++;let w=data.workshops.find(z=>z.name===x.workshop),dp=w?w.pay:0;pay+=dp;row.push((x.type==='congtrinh'?'Công trình: '+(x.project||''):'Xưởng: '+(x.workshop||''))+' | Vào '+(x.in||'')+' - Ra '+(x.out||''))}else row.push('')}row.push(c,pay);rows.push(row)}let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='TT_Bang_cham_cong_'+Y+'_'+M+'.csv';a.click()}
function clearAll(){if(confirm('Xóa toàn bộ nhân viên, xưởng và dữ liệu trên thiết bị này?')){data={employees:[],records:{},workshops:[]};save();notify('Đã xóa toàn bộ')}}
setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleString('vi-VN',{hour12:false}),1000);month.addEventListener('change',render);render();renderWorkshops();
</script>
</body>
</html>
