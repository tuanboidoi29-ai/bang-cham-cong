<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TT - Bảng chấm công</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#17212b;font-family:Arial,Helvetica,sans-serif}.app{max-width:1500px;margin:auto;padding:10px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 10px}.top h2{margin:0;font-size:21px}.tabs{display:flex;gap:7px;overflow-x:auto;position:sticky;top:0;z-index:20;background:#f3f6fa;padding:4px 0 9px}.tab{flex:0 0 auto;border:0;border-radius:12px;padding:11px 15px;background:#e2e8f0;color:#334155;font-weight:700;white-space:nowrap}.tab.active{background:#1677ff;color:#fff}.tab.add{background:#087443;color:#fff}button,input,select{font:inherit;border:1px solid #ccd6e2;border-radius:10px;padding:9px 10px;background:#fff}button{border:0;background:#1677ff;color:#fff;font-weight:700;cursor:pointer}.green{background:#087443}.gray{background:#667085}.orange{background:#d97706}.danger{background:#b42318}.card{background:#fff;border-radius:15px;padding:13px;margin:9px 0;box-shadow:0 2px 12px #0f172a14}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.title{font-size:20px;font-weight:800}.hint{font-size:13px;color:#667085}.money{color:#087443;font-weight:800}.wages{display:grid;grid-template-columns:repeat(2,minmax(150px,220px));gap:8px}.wage{display:flex;flex-direction:column;gap:4px}.wage label{font-size:12px;font-weight:800;color:#475467}.wage input{font-weight:700}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.stat{padding:9px 12px;border-radius:11px;background:#f7f9fc}.tableWrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1050px}th,td{border:1px solid #d9e1ea;padding:6px;text-align:center;font-size:12px}th{background:#edf3fa;font-weight:800}.left{text-align:left}.grid th,.grid td{min-width:58px}.grid th:first-child,.grid td:first-child{position:sticky;left:0;z-index:3;background:#fff;min-width:145px}.grid th:first-child{background:#edf3fa}.daycell{height:58px;cursor:pointer}.daycell:hover{background:#eef5ff}.worked{background:#e8f7ed}.construction{background:#fff0d8}.today{outline:2px solid #1677ff;outline-offset:-2px}.daynum{font-size:13px;font-weight:900}.times{font-size:10px;color:#475467;margin-top:3px}.place{font-size:10px;font-weight:700}.empty{text-align:center;color:#98a2b3;padding:20px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:14px;z-index:100}.modal.show{display:flex}.box{width:min(480px,100%);background:#fff;border-radius:18px;padding:18px}.box h3{margin:0 0 12px}.row{display:flex;gap:8px;margin:8px 0}.row>*{flex:1;min-width:0}.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.choice button{min-height:85px;font-size:16px}.choice .selected{outline:4px solid #1677ff}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#17212b;color:#fff;padding:10px 15px;border-radius:12px;display:none;z-index:200}.toast.show{display:block}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px}.legend span{padding:5px 8px;border-radius:7px}.sign{display:none}
@media(max-width:600px){.app{padding:8px}.top h2{font-size:18px}.wages{grid-template-columns:1fr 1fr}.choice button{font-size:14px;min-height:75px}.row{flex-direction:column}.row button{width:100%}}
@media print{body{background:#fff}.noPrint{display:none!important}.app{max-width:none;padding:0}.card{box-shadow:none;padding:4px;margin:0 0 6px}.tableWrap{overflow:visible}.grid{min-width:0;width:100%}.grid th,.grid td{font-size:7px;padding:2px;min-width:0}.grid th:first-child,.grid td:first-child{position:static;min-width:55px}.sign{display:flex;justify-content:space-around;text-align:center;margin-top:22px}.sign div{width:220px}}
</style>
</head>
<body>
<div class="app">
<div class="top noPrint"><h2>🕘 TT - BẢNG CHẤM CÔNG</h2><b id="clock"></b></div>
<div id="tabs" class="tabs noPrint"></div>
<div id="content"></div>
</div>

<div id="workshopModal" class="modal"><div class="box"><h3>🏭 Thêm xưởng</h3><div class="row"><input id="wName" placeholder="Tên xưởng"></div><div class="row"><input id="wLX" type="number" min="0" inputmode="numeric" placeholder="Lương làm xưởng / ngày"></div><div class="row"><input id="wCT" type="number" min="0" inputmode="numeric" placeholder="Lương đi công trình / ngày"></div><div class="row"><button class="green" onclick="saveWorkshop()">Lưu</button><button class="gray" onclick="closeM('workshopModal')">Hủy</button></div></div></div>

<div id="punchModal" class="modal"><div class="box"><h3>🟢 CHẤM CÔNG</h3><div class="hint" id="punchWorkshop"></div><div class="row"><input id="pName" placeholder="Tên người chấm công"></div><div class="choice"><button id="btnLX" class="green" onclick="chooseType('xuong')">🏭<br>LX<br><small>Làm xưởng</small></button><button id="btnCT" class="orange" onclick="chooseType('congtrinh')">🏗<br>CT<br><small>Công trình</small></button></div><div class="row"><input id="pWage" type="number" min="0" inputmode="numeric" placeholder="Tiền lương/ngày"></div><div class="hint">Lần 1 ghi giờ vào · lần 2 ghi giờ ra. Tên người chấm sẽ tự xuất hiện trong bảng, không cần thêm nhân viên trước.</div><div class="row"><button class="green" onclick="doPunch()">Xác nhận chấm công</button><button class="gray" onclick="closeM('punchModal')">Hủy</button></div></div></div>

<div id="editModal" class="modal"><div class="box"><h3>✏️ Sửa ngày công</h3><div id="editInfo" class="hint"></div><div class="row"><input id="eIn" type="time" step="1"><input id="eOut" type="time" step="1"></div><div class="choice"><button id="eLX" class="green" onclick="chooseEditType('xuong')">🏭 LX<br><small>Làm xưởng</small></button><button id="eCT" class="orange" onclick="chooseEditType('congtrinh')">🏗 CT<br><small>Công trình</small></button></div><div class="row"><input id="eWage" type="number" min="0" inputmode="numeric" placeholder="Tiền lương/ngày"></div><div class="row"><button class="green" onclick="saveEdit()">Lưu</button><button class="danger" onclick="removeEdit()">Xóa</button><button class="gray" onclick="closeM('editModal')">Hủy</button></div></div></div>
<div id="toast" class="toast"></div>

<script>
const KEY='TT_CC_V9';
let data=load(),active=0,month=new Date().toISOString().slice(0,7),pName='',pType='xuong',editKey='',editType='xuong';
function uid(){return'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function load(){let d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&Array.isArray(d.workshops))return d;let old=JSON.parse(localStorage.getItem('TT_CC_V8')||localStorage.getItem('TT_CC_V7')||localStorage.getItem('TT_CC_V6')||'null');let x={workshops:[],records:{}};if(old&&Array.isArray(old.workshops)&&old.workshops.length){x.workshops=old.workshops.map(w=>({id:w.id||uid(),name:w.name||'Xưởng',lx:Number(w.lx??w.pay)||0,ct:Number(w.ct??0)||0}));Object.keys(old.records||{}).forEach(k=>{let a=k.split('|'),w=x.workshops.find(q=>q.id===a[0]);if(w){let emp=a[1]||'',date=a[2]||'';if(emp&&date)x.records[w.id+'|'+emp+'|'+date]={...old.records[k]}}})}else{x.workshops=[{id:uid(),name:'Xưởng 1',lx:0,ct:0}]};localStorage.setItem(KEY,JSON.stringify(x));return x}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return Number(n||0).toLocaleString('vi-VN')+' đ'}
function pad(n){return String(n).padStart(2,'0')}
function dt(y,m,d){return y+'-'+pad(m)+'-'+pad(d)}
function today(){let x=new Date();return dt(x.getFullYear(),x.getMonth()+1,x.getDate())}
function now(){let x=new Date();return pad(x.getHours())+':'+pad(x.getMinutes())+':'+pad(x.getSeconds())}
function key(w,e,d){return w.id+'|'+e+'|'+d}
function rec(w,e,d){return data.records[key(w,e,d)]||null}
function hours(a,b){if(!a||!b)return 0;let A=a.split(':').map(Number),B=b.split(':').map(Number),v=B[0]*3600+B[1]*60+(B[2]||0)-A[0]*3600-A[1]*60-(A[2]||0);if(v<0)v+=86400;return v/3600}
function closeM(id){document.getElementById(id).classList.remove('show')}
function openM(id){document.getElementById(id).classList.add('show')}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function tabs(){let h=data.workshops.map((w,i)=>'<button class="tab '+(i===active?'active':'')+'" onclick="active='+i+';render()">🏭 '+esc(w.name)+'</button>').join('');h+='<button class="tab add" onclick="newWorkshop()">＋ Thêm xưởng</button>';document.getElementById('tabs').innerHTML=h}
function newWorkshop(){document.getElementById('wName').value='';document.getElementById('wLX').value='';document.getElementById('wCT').value='';openM('workshopModal')}
function saveWorkshop(){let n=document.getElementById('wName').value.trim(),lx=Number(document.getElementById('wLX').value||0),ct=Number(document.getElementById('wCT').value||0);if(!n)return toast('Nhập tên xưởng');data.workshops.push({id:uid(),name:n,lx,ct});active=data.workshops.length-1;save();closeM('workshopModal');toast('Đã tạo xưởng')}
function editWorkshop(){let w=data.workshops[active],n=prompt('Tên xưởng:',w.name);if(n===null)return;let lx=prompt('Lương làm xưởng / ngày:',w.lx),ct=prompt('Lương đi công trình / ngày:',w.ct);if(lx===null||ct===null)return;w.name=n.trim()||w.name;w.lx=Number(lx)||0;w.ct=Number(ct)||0;save();toast('Đã cập nhật lương')}
function deleteWorkshop(){if(data.workshops.length===1)return toast('Phải giữ ít nhất 1 xưởng');let w=data.workshops[active];if(!confirm('Xóa '+w.name+' và toàn bộ chấm công?'))return;Object.keys(data.records).forEach(k=>{if(k.startsWith(w.id+'|'))delete data.records[k]});data.workshops.splice(active,1);active=Math.max(0,active-1);save()}
function openPunch(){let w=data.workshops[active];pName='';pType='xuong';document.getElementById('pName').value='';document.getElementById('punchWorkshop').textContent=w.name+' · chọn LX hoặc CT';document.getElementById('pWage').value=w.lx;markType();openM('punchModal')}
function chooseType(t){pType=t;let w=data.workshops[active];document.getElementById('pWage').value=t==='xuong'?w.lx:w.ct;markType()}
function markType(){document.getElementById('btnLX').classList.toggle('selected',pType==='xuong');document.getElementById('btnCT').classList.toggle('selected',pType==='congtrinh')}
function doPunch(){let w=data.workshops[active],name=document.getElementById('pName').value.trim(),wage=Number(document.getElementById('pWage').value||0);if(!name)return toast('Nhập tên người chấm công');if(wage<0)return toast('Tiền lương không hợp lệ');let k=key(w,name,today()),r=data.records[k];if(!r){data.records[k]={in:now(),out:'',type:pType,wage};toast('Đã ghi giờ vào')}else if(!r.out){r.out=now();r.type=pType;r.wage=wage;toast('Đã ghi giờ ra')}else{data.records[k]={in:now(),out:'',type:pType,wage};toast('Bắt đầu ca mới')}save();closeM('punchModal')}
function openEdit(name,date){let w=data.workshops[active],k=key(w,name,date),r=data.records[k];if(!r)return;editKey=k;editType=r.type||'xuong';document.getElementById('editInfo').textContent=name+' · '+date;document.getElementById('eIn').value=r.in||'';document.getElementById('eOut').value=r.out||'';document.getElementById('eWage').value=Number(r.wage??(editType==='xuong'?w.lx:w.ct));markEditType();openM('editModal')}
function chooseEditType(t){editType=t;let w=data.workshops[active];document.getElementById('eWage').value=t==='xuong'?w.lx:w.ct;markEditType()}
function markEditType(){document.getElementById('eLX').classList.toggle('selected',editType==='xuong');document.getElementById('eCT').classList.toggle('selected',editType==='congtrinh')}
function saveEdit(){if(!editKey)return;let wage=Number(document.getElementById('eWage').value||0);data.records[editKey]={in:document.getElementById('eIn').value,out:document.getElementById('eOut').value,type:editType,wage};save();closeM('editModal');toast('Đã lưu')}
function removeEdit(){if(!confirm('Xóa ngày công này?'))return;delete data.records[editKey];save();closeM('editModal')}
function namesForMonth(w,Y,M,days){let s=new Set();Object.keys(data.records).forEach(k=>{if(!k.startsWith(w.id+'|'))return;let a=k.split('|'),d=a[2]||'';if(d.startsWith(Y+'-'+pad(M)+'-'))s.add(a[1])});return Array.from(s).sort((a,b)=>a.localeCompare(b,'vi'))}
function render(){tabs();let w=data.workshops[active];if(!w)return;let [Y,M]=month.split('-').map(Number),days=new Date(Y,M,0).getDate(),names=namesForMonth(w,Y,M,days),totalD=0,totalH=0,totalP=0;let head='<tr><th>Người chấm</th>';for(let d=1;d<=days;d++)head+='<th>'+pad(d)+'</th>';head+='<th>Tổng ngày</th><th>Tổng giờ</th><th>Tổng tiền</th></tr>';let body='';names.forEach(name=>{let dcount=0,hcount=0,pcount=0,cells='';for(let d=1;d<=days;d++){let date=dateKey(Y,M,d),r=rec(w,name,date),cl='daycell'+(date===today()?' today':'');if(r){dcount++;hcount+=hours(r.in,r.out);pcount+=Number(r.wage||0);cl+=' '+(r.type==='congtrinh'?'construction':'worked');cells+='<td class="'+cl+'" onclick="openEdit('+JSON.stringify(name)+','+JSON.stringify(date)+')"><div class="daynum">'+(r.type==='congtrinh'?'CT':'LX')+'</div><div class="times">'+esc(r.in||'')+' '+esc(r.out||'')+'</div><div class="place">'+money(r.wage||0)+'</div></td>'}else cells+='<td class="'+cl+'" onclick="startEmpty('+JSON.stringify(name)+','+JSON.stringify(date)+')">—</td>'}totalD+=dcount;totalH+=hcount;totalP+=pcount;body+='<tr><td class="left"><b>'+esc(name)+'</b></td>'+cells+'<td><b>'+dcount+'</b></td><td>'+hcount.toFixed(2)+'</td><td class="money">'+money(pcount)+'</td></tr>'});document.getElementById('content').innerHTML='<div class="card"><div class="bar"><div><div class="title">🏭 '+esc(w.name)+'</div><div class="hint">Chấm công trực tiếp trong xưởng này</div></div><div class="controls noPrint"><button class="orange" onclick="editWorkshop()">⚙️ Sửa lương</button><button class="danger" onclick="deleteWorkshop()">Xóa xưởng</button></div></div><div class="wages noPrint" style="margin-top:12px"><div class="wage"><label>LX · Lương làm xưởng / ngày</label><input id="quickLX" type="number" min="0" value="'+Number(w.lx||0)+'" onchange="w.lx=Number(this.value||0);save()"></div><div class="wage"><label>CT · Lương đi công trình / ngày</label><input id="quickCT" type="number" min="0" value="'+Number(w.ct||0)+'" onchange="w.ct=Number(this.value||0);save()"></div></div><div class="stats"><span class="stat">📅 '+pad(M)+'/'+Y+'</span><span class="stat">👤 '+names.length+' người</span><span class="stat">✅ '+totalD+' ngày</span><span class="stat">⏱ '+totalH.toFixed(2)+' giờ</span><span class="stat money">💰 '+money(totalP)+'</span></div></div><div class="card noPrint"><div class="bar"><div><b>🟢 Chấm công</b><div class="hint">Không cần thêm nhân viên. Nhấn nút và nhập tên ngay khi chấm.</div></div><div class="controls"><input type="month" value="'+month+'" onchange="month=this.value;render()"><button class="green" onclick="openPunch()">🟢 CHẤM CÔNG</button><button onclick="window.print()">🖨️ Xuất PDF</button></div></div></div><div class="card"><div class="bar"><b>📅 Bảng chấm công tháng '+pad(M)+'/'+Y+'</b><div class="legend"><span class="worked">LX = Làm xưởng</span><span class="construction">CT = Công trình</span><span>Chạm ô để sửa</span></div></div><div class="tableWrap"><table class="grid"><thead>'+head+'</thead><tbody>'+(body||'<tr><td colspan="99" class="empty">Chưa có dữ liệu. Nhấn CHẤM CÔNG để bắt đầu.</td></tr>')+'</tbody></table></div><div class="sign"><div>Người lập bảng<br><br><br>________________</div><div>Người duyệt<br><br><br>________________</div></div></div>'}
function dateKey(y,m,d){return y+'-'+pad(m)+'-'+pad(d)}
function startEmpty(name,date){pName=name;openPunch();document.getElementById('pName').value=name}
setInterval(()=>{let e=document.getElementById('clock');if(e)e.textContent=new Date().toLocaleString('vi-VN',{hour12:false})},1000);
render();
</script>
</body>
</html>
