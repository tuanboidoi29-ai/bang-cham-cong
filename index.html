<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TT - Bảng chấm công</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#182230}.app{max-width:1200px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 2px 12px #0001}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}button,input{padding:10px;border-radius:10px;border:1px solid #ccd6e2;font:inherit}button{background:#1677ff;color:white;border:0;font-weight:bold}.red{background:#d83c3c}.gray{background:#667085}.controls{display:flex;gap:8px;flex-wrap:wrap}.wrap{overflow:auto}table{border-collapse:separate;border-spacing:0;min-width:1050px;width:100%}th,td{border-right:1px solid #dbe3ee;border-bottom:1px solid #dbe3ee;text-align:center;padding:7px}th{background:#edf3fa;position:sticky;top:0}.name{position:sticky;left:0;background:#fff;text-align:left;min-width:150px;font-weight:bold}.day{min-width:92px;height:82px}.in{color:#087443;font-weight:bold;font-size:12px}.out{color:#c62828;font-weight:bold;font-size:12px}.today{background:#f1f7ff!important;border:2px solid #1677ff}.small{padding:6px;font-size:12px}.stat{display:inline-block;background:#f7f9fc;border-radius:10px;padding:10px;margin-right:7px}</style></head><body><div class="app"><div class="top"><h2>🕘 BẢNG CHẤM CÔNG</h2><b id="clock"></b></div><div class="card"><button onclick="quick()">🟢 CHẤM CÔNG HÔM NAY</button><span id="today"></span><p>Lần 1 ghi giờ vào • Lần 2 ghi giờ ra • Dữ liệu tự lưu trên trình duyệt.</p></div><div class="card"><div class="controls"><input id="name" placeholder="Tên nhân viên"><button onclick="add()">＋ Thêm nhân viên</button><input id="month" type="month"><button class="gray" onclick="csv()">Xuất Excel/CSV</button><button class="red" onclick="clearAll()">Xóa dữ liệu</button></div></div><div class="card" id="stats"></div><div class="card"><div class="wrap"><table id="t"></table></div></div></div><script>const K='TT_CC_V3';let d=JSON.parse(localStorage.getItem(K)||'{"e":[],"l":{}}');let m=document.getElementById('month'),z=new Date();m.value=z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0');function p(x){return String(x).padStart(2,'0')}function ky(y,m,d){return y+'-'+p(m)+'-'+p(d)}function tm(){let x=new Date();return p(x.getHours())+':'+p(x.getMinutes())+':'+p(x.getSeconds())}function save(){localStorage.setItem(K,JSON.stringify(d));render()}function add(){let n=document.getElementById('name').value.trim();if(!n)return alert('Nhập tên nhân viên');if(!d.e.includes(n))d.e.push(n);document.getElementById('name').value='';save()}function punch(n,k){let x=d.l[n+'|'+k]||{};if(!x.in)x.in=tm();else if(!x.out)x.out=tm();else{x={in:tm(),out:''}}d.l[n+'|'+k]=x;save()}function quick(){if(!d.e.length)return alert('Hãy thêm nhân viên trước');let n=prompt('Tên nhân viên:\n'+d.e.join('\n'));if(d.e.includes(n)){let x=new Date();punch(n,ky(x.getFullYear(),x.getMonth()+1,x.getDate()))}else if(n)alert('Không tìm thấy nhân viên')}function edit(n,k){let x=d.l[n+'|'+k]||{},a=prompt('Giờ vào',x.in||'');if(a===null)return,b=prompt('Giờ ra',x.out||'');if(b===null)return;d.l[n+'|'+k]={in:a,out:b};save()}function render(){let [Y,M]=m.value.split('-').map(Number),ds=new Date(Y,M,0).getDate(),now=new Date(),tk=ky(now.getFullYear(),now.getMonth()+1,now.getDate()),h='<thead><tr><th>NHÂN VIÊN</th>';for(let i=1;i<=ds;i++)h+='<th>'+p(i)+'/'+p(M)+'</th>';h+='<th>TỔNG</th></tr></thead><tbody>';let total=0;for(let n of d.e){let c=0;h+='<tr><td class="name">'+n+'</td>';for(let i=1;i<=ds;i++){let k=ky(Y,M,i),x=d.l[n+'|'+k],q=k==tk?'today':'';if(x){c++;h+='<td class="day '+q+'"><b>'+i+'/'+M+'</b><div class="in">Vào '+(x.in||'--')+'</div><div class="out">Ra '+(x.out||'--')+'</div><button class="small gray" onclick=\'edit('+JSON.stringify(n)+','+JSON.stringify(k)+')\'>Sửa</button></td>'}else h+='<td class="day '+q+'"><b>'+i+'/'+M+'</b><br><button class="small" onclick=\'punch('+JSON.stringify(n)+','+JSON.stringify(k)+')\'>Chấm</button></td>'}total+=c;h+='<td><b>'+c+'</b> ngày</td></tr>'}if(!d.e.length)h+='<tr><td colspan="40">Chưa có nhân viên</td></tr>';document.getElementById('t').innerHTML=h+'</tbody>';document.getElementById('stats').innerHTML='<span class="stat">👥 Nhân viên <b>'+d.e.length+'</b></span><span class="stat">📅 '+M+'/'+Y+'</span><span class="stat">✅ Ngày công <b>'+total+'</b></span>';document.getElementById('today').textContent=' Hôm nay: '+now.toLocaleDateString('vi-VN')}function csv(){let [Y,M]=m.value.split('-').map(Number),ds=new Date(Y,M,0).getDate(),r=[['Nhân viên',...Array.from({length:ds},(_,i)=>i+1+'/'+M),'Tổng']];for(let n of d.e){let a=[n],c=0;for(let i=1;i<=ds;i++){let x=d.l[n+'|'+ky(Y,M,i)];if(x){c++;a.push('Vào '+(x.in||'')+' - Ra '+(x.out||''))}else a.push('')}a.push(c);r.push(a)}let s='\ufeff'+r.map(x=>x.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='Bang_cham_cong_'+Y+'_'+M+'.csv';a.click()}function clearAll(){if(confirm('Xóa toàn bộ dữ liệu?')){d={e:[],l:{}};save()}}setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleString('vi-VN',{hour12:false}),1000);m.onchange=render;render()</script></body></html>
