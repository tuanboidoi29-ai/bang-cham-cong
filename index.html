<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="format-detection" content="telephone=no"><title>TT - Bảng chấm công</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#17212b;font-family:Arial,Helvetica,sans-serif}.app{max-width:1400px;margin:auto;padding:10px}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px}.top h2{margin:0;font-size:21px}.tabs{display:flex;gap:7px;overflow-x:auto;position:sticky;top:0;z-index:10;background:#f3f6fa;padding:4px 0 8px}.tab,button,input,select{font:inherit;border-radius:10px}.tab,button{border:0;padding:10px 13px;font-weight:700;cursor:pointer}.tab{background:#e2e8f0;color:#334155;white-space:nowrap}.tab.active{background:#1677ff;color:#fff}.tab.add,.green{background:#087443;color:#fff}.gray{background:#667085;color:#fff}.orange{background:#d97706;color:#fff}.danger{background:#b42318;color:#fff}.card{background:#fff;border-radius:15px;padding:13px;margin:9px 0;box-shadow:0 2px 12px #0f172a14}.bar,.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}input,select{border:1px solid #ccd6e2;padding:10px;background:#fff}.title{font-size:20px;font-weight:800}.money{color:#087443;font-weight:800}.hint{font-size:13px;color:#667085}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.stat{background:#f7f9fc;border-radius:10px;padding:8px 11px}.employees{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:9px}.employee{border:1px solid #dbe3ee;border-radius:13px;padding:11px}.ename{font-weight:800}.status{font-size:12px;color:#667085;margin-top:6px;min-height:18px}.punch{width:100%;margin-top:9px;font-size:16px}.small{padding:7px 9px;font-size:12px}.tableWrap{overflow:auto}table{border-collapse:collapse;width:100%}th,td{border:1px solid #d9e1ea;padding:6px;text-align:center;font-size:12px;white-space:nowrap}th{background:#edf3fa}.left{text-align:left}.daygrid{min-width:1050px}.daygrid th{position:sticky;top:0;z-index:2}.daygrid .name{position:sticky;left:0;background:#fff;z-index:3;min-width:145px}.day{min-width:42px;height:44px;padding:3px!important}.worked{background:#dff6e8;color:#087443;font-weight:800}.building{background:#fff0d6;color:#a15c00;font-weight:800}.today{outline:2px solid #1677ff;outline-offset:-2px}.cellbtn{display:block;width:100%;height:100%;padding:2px;border:0;background:transparent;font-size:11px;color:inherit}.paytable td,.paytable th{font-size:12px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:14px;z-index:50}.modal.show{display:flex}.box{background:#fff;width:min(480px,100%);border-radius:18px;padding:18px}.row{display:flex;gap:8px;margin:8px 0}.row>*{flex:1;min-width:0}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#17212b;color:#fff;padding:10px 15px;border-radius:12px;display:none;z-index:80}.toast.show{display:block}@media(max-width:600px){.top h2{font-size:18px}.employees{grid-template-columns:1fr}.row{flex-direction:column}}@media print{body{background:#fff}.noPrint{display:none!important}.app{max-width:none;padding:0}.card{box-shadow:none}.tableWrap{overflow:visible}.daygrid{min-width:0;font-size:7px}.daygrid th,.daygrid td{font-size:7px;padding:2px}.daygrid .name{min-width:80px}.paytable th,.paytable td{font-size:8px;padding:3px}}</style></head><body><div class="app"><div class="top noPrint"><h2>🕘 TT - BẢNG CHẤM CÔNG</h2><b id="clock"></b></div><div id="tabs" class="tabs noPrint"></div><div id="content"></div></div><div id="addModal" class="modal"><div class="box"><h3>🏭 Thêm xưởng</h3><div class="row"><input id="newWorkshop" placeholder="Tên xưởng"></div><div class="row"><input id="newPay" type="number" min="0" placeholder="Tiền công/ngày (VNĐ)"></div><div class="row"><button class="green" onclick="addWorkshop()">Thêm xưởng</button><button class="gray" onclick="closeM('addModal')">Đóng</button></div></div></div><div id="empModal" class="modal"><div class="box"><h3>👷 Thêm nhân viên</h3><div class="row"><input id="newEmp" placeholder="Tên nhân viên"></div><div class="row"><button class="green" onclick="addEmp()">Thêm</button><button class="gray" onclick="closeM('empModal')">Đóng</button></div></div></div><div id="punchModal" class="modal"><div class="box"><h3 id="pTitle">🟢 Chấm công</h3><div class="row"><select id="ptype" onchange="toggleProject()"><option value="xuong">🏭 Làm tại xưởng</option><option value="congtrinh">🏗 Đi công trình</option></select></div><div class="row"><input id="project" placeholder="Tên công trình" style="display:none"></div><div class="hint">Lần 1 = giờ vào · Lần 2 = giờ ra · chấm tiếp = ca mới.</div><div class="row"><button class="green" onclick="doPunch()">Xác nhận</button><button class="gray" onclick="closeM('punchModal')">Hủy</button></div></div></div><div id="editModal" class="modal"><div class="box"><h3>✏️ Sửa ngày công</h3><div id="editInfo" class="hint"></div><div class="row"><input id="ein" type="time" step="1"><input id="eout" type="time" step="1"></div><div class="row"><select id="etype" onchange="toggleEditProject()"><option value="xuong">🏭 Xưởng</option><option value="congtrinh">🏗 Công trình</option></select><input id="eproject" placeholder="Công trình"></div><div class="row"><button class="green" onclick="saveEdit()">Lưu</button><button class="danger" onclick="delEdit()">Xóa</button><button class="gray" onclick="closeM('editModal')">Hủy</button></div></div></div><div id="toast" class="toast"></div><script>
const KEY='TT_CC_V6';let data=load(),active=0,selMonth=new Date().toISOString().slice(0,7),pEmp='',editKey='';
function uid(){return'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function load(){let d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&Array.isArray(d.workshops))return d;let w={id:uid(),name:'Xưởng 1',pay:0,employees:[]};let d2={workshops:[w],records:{}};localStorage.setItem(KEY,JSON.stringify(d2));return d2}function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return Number(n||0).toLocaleString('vi-VN')+' đ'}function pad(n){return String(n).padStart(2,'0')}function dateKey(y,m,d){return y+'-'+pad(m)+'-'+pad(d)}function today(){let x=new Date();return dateKey(x.getFullYear(),x.getMonth()+1,x.getDate())}function timeNow(){let x=new Date();return pad(x.getHours())+':'+pad(x.getMinutes())+':'+pad(x.getSeconds())}function key(w,e,date){return w.id+'|'+e+'|'+date}function rec(w,e,date){return data.records[key(w,e,date)]||null}function hrs(a,b){if(!a||!b)return 0;let A=a.split(':').map(Number),B=b.split(':').map(Number),v=B[0]*3600+B[1]*60+(B[2]||0)-A[0]*3600-A[1]*60-(A[2]||0);if(v<0)v+=86400;return v/3600}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}function openM(id){document.getElementById(id).classList.add('show')}function closeM(id){document.getElementById(id).classList.remove('show')}
function addWorkshop(){let n=document.getElementById('newWorkshop').value.trim(),p=Number(document.getElementById('newPay').value||0);if(!n)return toast('Nhập tên xưởng');if(data.workshops.some(w=>w.name.toLowerCase()===n.toLowerCase()))return toast('Xưởng đã tồn tại');data.workshops.push({id:uid(),name:n,pay:p,employees:[]});active=data.workshops.length-1;save();closeM('addModal')}function addEmp(){let n=document.getElementById('newEmp').value.trim(),w=data.workshops[active];if(!n)return toast('Nhập tên nhân viên');if(w.employees.some(x=>x.toLowerCase()===n.toLowerCase()))return toast('Nhân viên đã có');w.employees.push(n);save();closeM('empModal')}function editWorkshop(){let w=data.workshops[active],n=prompt('Tên xưởng:',w.name);if(n===null)return;let p=prompt('Tiền công/ngày (VNĐ):',w.pay);if(p===null)return;w.name=n.trim()||w.name;w.pay=Number(p)||0;save()}function delWorkshop(){if(data.workshops.length<2)return toast('Phải giữ ít nhất 1 xưởng');let w=data.workshops[active];if(!confirm('Xóa '+w.name+' và toàn bộ chấm công?'))return;Object.keys(data.records).forEach(k=>{if(k.startsWith(w.id+'|'))delete data.records[k]});data.workshops.splice(active,1);active=Math.max(0,active-1);save()}function renameEmp(i){let w=data.workshops[active],old=w.employees[i],n=prompt('Tên nhân viên:',old);if(n===null)return;n=n.trim();if(!n||n===old)return;Object.keys(data.records).forEach(k=>{let pre=w.id+'|'+old+'|';if(k.startsWith(pre)){let d=k.slice(pre.length);data.records[w.id+'|'+n+'|'+d]=data.records[k];delete data.records[k]}});w.employees[i]=n;save()}function removeEmp(i){let w=data.workshops[active];if(confirm('Xóa '+w.employees[i]+'?')){w.employees.splice(i,1);save()}}
function openPunch(e){pEmp=e;let w=data.workshops[active],r=rec(w,e,today());document.getElementById('pTitle').textContent='🟢 '+e+' · '+w.name;document.getElementById('ptype').value=r?.type||'xuong';document.getElementById('project').value=r?.project||'';toggleProject();openM('punchModal')}function toggleProject(){document.getElementById('project').style.display=document.getElementById('ptype').value==='congtrinh'?'block':'none'}function doPunch(){let w=data.workshops[active],t=document.getElementById('ptype').value,p=document.getElementById('project').value.trim();if(t==='congtrinh'&&!p)return toast('Nhập tên công trình');let k=key(w,pEmp,today()),r=data.records[k]||{};if(!r.in){r={in:timeNow(),out:'',type:t,project:p};toast('Đã ghi giờ vào')}else if(!r.out){r.out=timeNow();toast('Đã ghi giờ ra')}else{r={in:timeNow(),out:'',type:t,project:p};toast('Đã bắt đầu ca mới')}data.records[k]=r;save();closeM('punchModal')}
function openEdit(e,date){let w=data.workshops[active],k=key(w,e,date),r=data.records[k];editKey=k;document.getElementById('editInfo').textContent=e+' · '+date;document.getElementById('ein').value=r.in||'';document.getElementById('eout').value=r.out||'';document.getElementById('etype').value=r.type||'xuong';document.getElementById('eproject').value=r.project||'';toggleEditProject();openM('editModal')}function toggleEditProject(){document.getElementById('eproject').style.display=document.getElementById('etype').value==='congtrinh'?'block':'none'}function saveEdit(){let t=document.getElementById('etype').value,p=document.getElementById('eproject').value.trim();if(t==='congtrinh'&&!p)return toast('Nhập tên công trình');data.records[editKey]={in:document.getElementById('ein').value,out:document.getElementById('eout').value,type:t,project:p};save();closeM('editModal')}function delEdit(){if(confirm('Xóa ngày công này?')){delete data.records[editKey];save();closeM('editModal')}}
function tabs(){let h=data.workshops.map((w,i)=>'<button class="tab '+(i===active?'active':'')+'" onclick="active='+i+';render()">🏭 '+esc(w.name)+'</button>').join('');document.getElementById('tabs').innerHTML=h+'<button class="tab add" onclick="openM(\'addModal\')">＋ Thêm xưởng</button>'}
function render(){tabs();let w=data.workshops[active];if(!w){return}let [Y,M]=selMonth.split('-').map(Number),days=new Date(Y,M,0).getDate(),td=today(),totalD=0,totalH=0,totalP=0;
let cards=w.employees.map((e,i)=>{let d=0,h=0,p=0;for(let x=1;x<=days;x++){let r=rec(w,e,dateKey(Y,M,x));if(r){d++;h+=hrs(r.in,r.out);if(r.type==='xuong')p+=w.pay}}totalD+=d;totalH+=h;totalP+=p;let r=rec(w,e,td);return '<div class="employee"><div class="head"><span class="ename">👤 '+esc(e)+'</span><span class="money">'+money(p)+'</span></div><div class="status">'+(r?(r.out?'Đã đủ ca · '+r.in+' → '+r.out:'Đang làm · vào '+r.in):'Chưa chấm hôm nay')+'</div><button class="punch green" onclick="openPunch('+JSON.stringify(e)+')">🟢 CHẤM CÔNG</button><div class="controls" style="margin-top:6px"><button class="small orange" onclick="renameEmp('+i+')">Đổi tên</button><button class="small danger" onclick="removeEmp('+i+')">Xóa</button></div></div>'}).join('');
let grid='<table class="daygrid"><thead><tr><th class="name">NHÂN VIÊN</th>';for(let d=1;d<=days;d++)grid+='<th class="day '+(dateKey(Y,M,d)===td?'today':'')+'">'+pad(d)+'</th>';grid+='<th>TỔNG NGÀY</th><th>TỔNG GIỜ</th><th>TIỀN</th></tr></thead><tbody>';w.employees.forEach(e=>{let dcnt=0,h=0,p=0;grid+='<tr><td class="name left"><b>'+esc(e)+'</b></td>';for(let d=1;d<=days;d++){let date=dateKey(Y,M,d),r=rec(w,e,date),cl=r?(r.type==='congtrinh'?'building':'worked'):'',label=r?(r.out?(r.type==='congtrinh'?'CT':'X')+' '+r.in+'<br>'+r.out:(r.type==='congtrinh'?'CT':'X')+' '+r.in):'';if(r){dcnt++;h+=hrs(r.in,r.out);if(r.type==='xuong')p+=w.pay}grid+='<td class="day '+cl+' '+(date===td?'today':'')+'"><button class="cellbtn" onclick="openEdit('+JSON.stringify(e)+','+JSON.stringify(date)+')">'+label+'</button></td>'}grid+='<td><b>'+dcnt+'</b></td><td>'+h.toFixed(2)+'</td><td class="money">'+money(p)+'</td></tr>'});grid+='</tbody></table>';
let payRows=w.employees.map(e=>{let d=0,h=0,p=0,ct=0;for(let x=1;x<=days;x++){let r=rec(w,e,dateKey(Y,M,x));if(r){d++;h+=hrs(r.in,r.out);if(r.type==='xuong')p+=w.pay;else ct++}}return '<tr><td class="left">'+esc(e)+'</td><td>'+d+'</td><td>'+h.toFixed(2)+'</td><td>'+ct+'</td><td class="money">'+money(p)+'</td></tr>'}).join('');
document.getElementById('content').innerHTML='<div class="card"><div class="bar"><div><div class="title">🏭 '+esc(w.name)+'</div><div class="money">Tiền công xưởng: '+money(w.pay)+'/ngày</div></div><div class="controls noPrint"><button class="orange" onclick="editWorkshop()">⚙️ Sửa xưởng</button><button class="danger" onclick="delWorkshop()">Xóa xưởng</button></div></div><div class="stats"><span class="stat">👥 '+w.employees.length+' nhân viên</span><span class="stat">📅 Tháng '+pad(M)+'/'+Y+'</span><span class="stat">✅ '+totalD+' ngày công</span><span class="stat">⏱ '+totalH.toFixed(2)+' giờ</span><span class="stat">💰 '+money(totalP)+'</span></div></div><div class="card noPrint"><div class="bar"><b>Chấm công tại '+esc(w.name)+'</b><div class="controls"><input id="month" type="month" value="'+selMonth+'" onchange="selMonth=this.value;render()"><button class="green" onclick="document.getElementById(\'newEmp\').value=\'\';openM(\'empModal\')">＋ Thêm nhân viên</button><button onclick="printPDF()">🖨️ Xuất PDF</button></div></div><div class="hint" style="margin-top:7px">🟢 X = làm xưởng · 🟠 CT = công trình. Bấm vào ô ngày để sửa.</div></div><div class="card"><div class="bar"><b>📅 BẢNG CHẤM CÔNG THÁNG — ngày 01 → '+pad(days)+'</b><button class="noPrint gray" onclick="printPDF()">🖨️ PDF</button></div><div class="tableWrap">'+grid+'</div></div><div class="card"><b>💰 TỔNG HỢP TIỀN THEO NHÂN VIÊN</b><div class="tableWrap"><table class="paytable"><thead><tr><th>Nhân viên</th><th>Ngày công</th><th>Giờ</th><th>Ngày công trình</th><th>Tiền xưởng</th></tr></thead><tbody>'+payRows+'</tbody></table></div></div><div class="card noPrint"><div class="employees">'+(cards||'<div class="hint">Chưa có nhân viên.</div>')+'</div></div>'}
function printPDF(){let w=data.workshops[active],[Y,M]=selMonth.split('-').map(Number),days=new Date(Y,M,0).getDate(),rows='';w.employees.forEach(e=>{for(let d=1;d<=days;d++){let date=dateKey(Y,M,d),r=rec(w,e,date);if(!r)continue;rows+='<tr><td>'+date+'</td><td>'+esc(e)+'</td><td>'+(r.type==='xuong'?'Xưởng':'Công trình')+'</td><td>'+esc(r.type==='xuong'?w.name:r.project||'')+'</td><td>'+esc(r.in||'')+'</td><td>'+esc(r.out||'')+'</td><td>'+hrs(r.in,r.out).toFixed(2)+'</td><td>'+money(r.type==='xuong'?w.pay:0)+'</td></tr>'}});let win=window.open('','_blank');if(!win)return toast('Trình duyệt chặn cửa sổ PDF');win.document.write('<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>TT - Bảng chấm công</title><style>@page{size:A4 landscape;margin:10mm}body{font-family:Arial,Helvetica,sans-serif;font-size:9px;color:#111}h1{font-size:17px;margin:0 0 4px}h2{font-size:12px;margin:0 0 8px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #555;padding:4px;text-align:center}th{background:#e9eef5}.sig{display:flex;justify-content:space-around;margin-top:20px;text-align:center}.s{width:220px} </style></head><body><h1>TT - BẢNG CHẤM CÔNG</h1><h2>'+esc(w.name)+' · Tháng '+pad(M)+'/'+Y+' · Tiền xưởng: '+money(w.pay)+'/ngày</h2><table><thead><tr><th>Ngày</th><th>Nhân viên</th><th>Nơi làm</th><th>Xưởng / Công trình</th><th>Vào</th><th>Ra</th><th>Giờ</th><th>Tiền</th></tr></thead><tbody>'+ (rows||'<tr><td colspan="8">Không có dữ liệu</td></tr>')+'</tbody></table><div class="sig"><div class="s">Người lập bảng<br><br><br>________________</div><div class="s">Người duyệt<br><br><br>________________</div></div><script>window.onload=function(){setTimeout(function(){window.print()},300)}</script></body></html>');win.document.close()}
setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleString('vi-VN',{hour12:false}),1000);render();
</script></body></html>
