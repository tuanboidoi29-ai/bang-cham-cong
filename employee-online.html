<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Đăng ký công nhân</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#17212b;font-family:Arial,Helvetica,sans-serif}.app{max-width:720px;margin:auto;padding:12px}.card{background:#fff;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 2px 12px #0f172a14}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}label{font-size:12px;font-weight:800;color:#475467}input,button{font:inherit;border:1px solid #ccd6e2;border-radius:11px;padding:11px;background:#fff}button{border:0;background:#087443;color:#fff;font-weight:800;width:100%;min-height:48px}.hint{font-size:13px;color:#667085}.preview{width:100%;max-height:180px;object-fit:contain;border-radius:10px;background:#f7f9fc;display:none}.ok{display:none;background:#e8f7ed;border:1px solid #a9ddb8;border-radius:14px;padding:14px;margin-top:12px}.ok.show{display:block}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="app"><div class="card"><h2>🏢 ĐĂNG KÝ THÔNG TIN CÔNG NHÂN</h2><div class="hint">Điền thông tin và gửi về doanh nghiệp.</div></div><div class="card"><div class="grid"><div class="field full"><label>Họ và tên *</label><input id="fullName"></div><div class="field"><label>SĐT cá nhân *</label><input id="phone" inputmode="tel"></div><div class="field"><label>Ngày sinh</label><input id="dob" type="date"></div><div class="field"><label>Trình độ học vấn</label><input id="education"></div><div class="field"><label>Thuộc bộ phận *</label><input id="department"></div><div class="field"><label>Lương chính</label><input id="salaryMain" type="number"></div><div class="field"><label>Tăng ca / giờ</label><input id="overtimeRate" type="number"></div><div class="field"><label>Mã BHXH</label><input id="bhxh"></div><div class="field"><label>SĐT người thân</label><input id="emergencyPhone" inputmode="tel"></div><div class="field"><label>Ngày vào làm</label><input id="startDate" type="date"></div><div class="field full"><label>Ảnh cá nhân</label><input id="avatar" type="file" accept="image/*"><img id="avatarP" class="preview"></div><div class="field full"><label>CCCD mặt trước</label><input id="cccdFront" type="file" accept="image/*"><img id="cccdFrontP" class="preview"></div><div class="field full"><label>CCCD mặt sau</label><input id="cccdBack" type="file" accept="image/*"><img id="cccdBackP" class="preview"></div></div><button style="margin-top:14px" onclick="submitForm()">📨 GỬI ĐĂNG KÝ</button><div id="ok" class="ok">✅ Đã gửi thông tin thành công.</div></div></div><script>const API='https://vnvkmxqgbnmirsgdgfzm.supabase.co/functions/v1/tt-employee-registration';const token=new URLSearchParams(location.search).get('t')||'';let imgs={};async function imgToData(file){if(!file)return'';return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let max=1000,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.72))};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}for(let id of ['avatar','cccdFront','cccdBack'])document.getElementById(id).onchange=async e=>{let f=e.target.files&&e.target.files[0];if(!f)return;imgs[id]=await imgToData(f);let p=document.getElementById(id+'P');p.src=imgs[id];p.style.display='block'};async function submitForm(){let fullName=document.getElementById('fullName').value.trim(),phone=document.getElementById('phone').value.trim(),department=document.getElementById('department').value.trim();if(!token)return alert('Link đăng ký không hợp lệ');if(!fullName||!phone||!department)return alert('Nhập Họ tên, SĐT và Bộ phận');let profile={fullName,phone,dob:dob.value,education:education.value.trim(),department,salaryMain:Number(salaryMain.value||0),overtimeRate:Number(overtimeRate.value||0),bhxh:bhxh.value.trim(),emergencyPhone:emergencyPhone.value.trim(),startDate:startDate.value,avatar:imgs.avatar||'',cccdFront:imgs.cccdFront||'',cccdBack:imgs.cccdBack||'',source:'online',submittedAt:new Date().toISOString()};try{let res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'submit',public_token:token,profile})});let out=await res.json();if(!res.ok||!out.ok)throw 0;document.getElementById('ok').classList.add('show')}catch(e){alert('Không gửi được. Kiểm tra đường link hoặc mạng.')}}</script></body></html>
