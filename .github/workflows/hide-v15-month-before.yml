name: Hide TT V15 Month Before
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide month before button
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Hide/remove the V15 button anywhere it was injected.
          s=re.sub(r'<button[^>]*onclick=["\']monthHistory\(\)["\'][^>]*>\s*📅\s*Tháng trước\s*</button>', '', s, flags=re.I)
          # Also protect against any plain text occurrence rendered as a button.
          s=s.replace('📅 Tháng trước','')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Ẩn nút Tháng trước không hoạt động'
          git push
