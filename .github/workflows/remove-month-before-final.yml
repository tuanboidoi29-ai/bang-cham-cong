name: Remove TT Tháng trước Final
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove old month-before feature
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # The old V15 feature left empty purple buttons in the source.
          s=re.sub(r'<button\s+class=["\']purple["\']\s+onclick=["\']monthHistory\(\)["\']\s*>\s*</button>', '', s, flags=re.I)
          # Remove any remaining visible version of the old button.
          s=re.sub(r'<button\b[^>]*>\s*[^<]*📅\s*Tháng\s+trước\s*</button>', '', s, flags=re.I|re.S)
          s=re.sub(r'<button\b[^>]*>\s*[^<]*Tháng\s+trước\s*</button>', '', s, flags=re.I|re.S)
          # Remove obsolete V15 function if it exists as a standalone function.
          s=re.sub(r'function\s+monthHistory\s*\(\)\s*\{.*?\n\s*\}', '', s, flags=re.S)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'Đã sạch'; exit 0; fi
          git commit -m 'Xóa hẳn hai nút Tháng trước'
          git push
