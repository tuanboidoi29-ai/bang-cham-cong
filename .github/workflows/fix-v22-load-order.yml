name: Fix V22 Load Order
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep one fresh V22 script at the very end
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\s*<script\s+src=["\']v22\.js[^"\']*["\']\s*></script>','',s,flags=re.I)
          tag='\n<script src="v22.js?v=a49afb44-single-final"></script>\n'
          s=s.replace('</body>',tag+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Chỉ nạp một V22 sau cùng để hiện đúng Chọn số công'
          git push
