name: Apply Fix Controls
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Remove duplicate v22 includes, keep one.
          tag='<script src="v22.js?v=v223"></script>'
          while s.count(tag)>1:
              s=s.replace(tag+'\n'+tag,tag)
          # Ensure fix_controls is loaded last.
          fix='<script src="fix_controls.js?v=fix2"></script>'
          if fix not in s:
              s=s.replace('</body>',fix+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix nut Cham cong, Xuat PDF va Du lieu'
          git push
