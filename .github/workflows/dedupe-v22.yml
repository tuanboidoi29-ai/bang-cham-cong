name: Dedupe V22
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script src="v22\.js\?v=[^"]+"></script>\s*','',s)
          s=s.replace('<script src="v12.js"></script>','<script src="v12.js"></script>\n<script src="v22.js?v=single-4a0fbb16"></script>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add index.html
          git commit -m "Keep one V22 loader" || exit 0
          git push