name: Apply TT V12 Main
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        shell: bash
        run: |
          python - <<'PY'
          import gzip,base64
          b=''
          open('/tmp/patch.py','wb').write(gzip.decompress(base64.b64decode(b)))
          PY
          python /tmp/patch.py
      - name: Commit patched app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V12: them tam ung va tru tam ung'
          git push