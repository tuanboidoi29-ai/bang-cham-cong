name: Apply Backup Button Final
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); s=s if 'backup.js?v=backup2' in s else s.replace('</body>','<script src=\"backup.js?v=backup2\"></script>\\n</body>'); p.write_text(s,encoding='utf-8')"
      - run: git config user.name github-actions && git config user.email actions@github.com && git add index.html && (git diff --cached --quiet || (git commit -m 'Hien nut xuat nhap du lieu' && git push))
