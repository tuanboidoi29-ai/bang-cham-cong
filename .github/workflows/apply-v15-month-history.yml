name: Apply TT V15 Month History
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch month history
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if 'function monthHistory()' in s: raise SystemExit(0)
          s=s.replace('<div class="bar"><div><div class="title">', '<div class="bar"><div><div class="title">', 1)
          marker='function renderWorkshop(){'
          fn=r'''function monthHistory(){
            let w=data.workshops[active]; if(!w)return;
            let months=new Set(); Object.keys(data.records||{}).forEach(k=>{let a=k.split('|'),r=data.records[k]||{};if(a[0]===w.id){let d=r.date||a[2];if(d&&/^\d{4}-\d{2}/.test(d))months.add(d.slice(0,7))}});
            months.add(month); let list=[...months].sort().reverse();
            let h='<div class="card"><div class="bar"><div><div class="title">📅 Lịch sử bảng công — '+esc(w.name)+'</div><div class="hint">Chọn tháng để xem lại bảng công của riêng xưởng này.</div></div><select onchange="month=this.value;render()">'+list.map(m=>'<option value="'+m+'" '+(m===month?'selected':'')+'>'+m+'</option>').join('')+'</select></div></div>';
            h+='<div class="card"><div class="bar"><button class="green" onclick="render()">👁️ Xem tháng '+month+'</button><button class="purple" onclick="jpgExportWorkshop()">📸 Xuất JPG tháng '+month+'</button></div></div>';
            document.getElementById('content').insertAdjacentHTML('afterbegin',h);
          }
          '''
          # Add history button next to existing monthly selector in workshop header.
          needle="<input type=\"month\" value=\"'+month+'\" onchange=\"month=this.value;render()\">"
          if needle in s:
            s=s.replace(needle,needle+"<button class=\"purple\" onclick=\"monthHistory()\">📅 Tháng trước</button>",1)
          else:
            # fallback: inject a button into workshop content after rendering
            s=s.replace(marker,fn+marker,1)
            s=s.replace("function renderWorkshop(){", "function renderWorkshop(){",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add index.html .github/workflows/apply-v15-month-history.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V15: xem bang cong cac thang truoc theo xưởng'
          git push
