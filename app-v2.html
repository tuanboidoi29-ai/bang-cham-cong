<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TT - Bảng chấm công</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#f3f6fa;font-family:Arial,Helvetica,sans-serif}body{overflow:hidden}#chooser{position:fixed;inset:0;z-index:20;background:#f3f6fa;display:flex;align-items:center;justify-content:center;padding:20px}#chooser.hide{display:none}.box{width:min(520px,100%);background:#fff;border-radius:22px;padding:22px;box-shadow:0 12px 40px #0f172a22;text-align:center}.hint{color:#667085;margin-bottom:18px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mode{border:0;border-radius:18px;padding:22px 10px;color:#fff;font-weight:800;font-size:19px;min-height:130px}.mode small{display:block;font-size:12px;margin-top:8px}.personal{background:#087443}.enterprise{background:#7c3aed}#bar{display:none;height:58px;background:#fff;padding:7px 10px;gap:8px;align-items:center;border-bottom:1px solid #dce3eb}#bar.show{display:flex}#bar strong{flex:1}#bar button{border:0;border-radius:10px;background:#667085;color:#fff;padding:10px 12px;font-weight:700}iframe{display:none;border:0;width:100%;height:100%}body.running iframe{display:block}body.running #ttApp{height:calc(100% - 58px)}@media(max-width:600px){.modes{grid-template-columns:1fr}}</style></head><body><div id="chooser"><div class="box"><h2>🕘 TT - BẢNG CHẤM CÔNG</h2><div class="hint">Chọn chế độ sử dụng</div><div class="modes"><button class="mode personal" onclick="startMode('personal')">👤 CÁ NHÂN<small>Giao diện và dữ liệu cá nhân hiện tại</small></button><button class="mode enterprise" onclick="startMode('enterprise')">🏢 DOANH NGHIỆP<small>Chấm công + Hồ sơ OFFLINE/ONLINE riêng</small></button></div></div></div><div id="bar"><strong id="modeTitle"></strong><button onclick="changeMode()">Đổi chế độ</button></div><iframe id="ttApp"></iframe><script>const MODE='TT_CC_APP_MODE_V7',frame=document.getElementById('ttApp');let current='';function startMode(mode){current=mode==='enterprise'?'enterprise':'personal';localStorage.setItem(MODE,current);chooser.classList.add('hide');bar.classList.add('show');document.body.classList.add('running');modeTitle.textContent=current==='enterprise'?'🏢 DOANH NGHIỆP':'👤 CÁ NHÂN';frame.src=current==='enterprise'?'./enterprise-hr.html?v=hr1':'./index.html?v=personal-stable-20260914'}function changeMode(){localStorage.removeItem(MODE);current='';frame.src='about:blank';document.body.classList.remove('running');bar.classList.remove('show');chooser.classList.remove('hide')}let saved=localStorage.getItem(MODE);if(saved==='personal'||saved==='enterprise')startMode(saved);</script></body></html>
