<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký nhân viên</title></head><body><main><h2>ĐĂNG KÝ NHÂN VIÊN</h2><label>Họ và tên <input id="fullName"></label><label>SĐT <input id="phone"></label><label>Ngày sinh <input id="dob" type="date"></label><label>Trình độ học vấn <input id="education"></label><label>Bộ phận <select id="department"></select></label><label>Lương chính <input id="salaryMain" type="number"></label><label>Tăng ca/giờ <input id="overtimeRate" type="number"></label><label>Mã BHXH <input id="bhxh"></label><label>SĐT người thân <input id="emergencyPhone"></label><label>Ngày vào làm <input id="startDate" type="date"></label><label>Ảnh cá nhân <input id="avatar" type="file" accept="image/*"></label><label>Giấy tờ tùy thân mặt trước <input id="cccdFront" type="file" accept="image/*"></label><label>Giấy tờ tùy thân mặt sau <input id="cccdBack" type="file" accept="image/*"></label><button onclick="submitForm()">Gửi đăng ký</button></main><script>const API='https://vnvkmxqgbnmirsgdgfzm.supabase.co/functions/v1/tt-employee-registration';const q=new URLSearchParams(location.search),token=q.get('t')||'';function dec(s){try{return JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')))))}catch(e){return[]}}let deps=dec(q.get('d')||'');department.innerHTML=(deps.length?deps:['Bộ phận chung']).map(x=>'<option>'+x+'</option>').join('');async function data(id){let f=document.getElementById(id).files[0];if(!f)return'';return await new Promise(r=>{let x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)})}async function submitForm(){let profile={fullName:fullName.value.trim(),phone:phone.value.trim(),dob:dob.value,education:education.value.trim(),department:department.value,salaryMain:Number(salaryMain.value||0),overtimeRate:Number(overtimeRate.value||0),bhxh:bhxh.value.trim(),emergencyPhone:emergencyPhone.value.trim(),startDate:startDate.value,avatar:await data('avatar'),cccdFront:await data('cccdFront'),cccdBack:await data('cccdBack'),source:'online'};if(!profile.fullName||!profile.phone)return alert('Thiếu họ tên hoặc SĐT');let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'submit',public_token:token,profile})});let o=await r.json();alert(o.ok?'Đã gửi thành công':'Không gửi được')}</script></body></html>
